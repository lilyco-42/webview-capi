name: Cross-Platform CI

# 原来三个 job 全部 working-directory: lyco-webview/lyco —— 这个目录不存在
# （真实路径是 demo/lyco-cli/lyco），所以 macos 直接
#   An error occurred trying to start process '/bin/bash' with working directory
#   '.../lyco-webview/lyco'. No such file or directory
# 而 linux 更早一步就死在 `apt-get install libwebkit2gtk-4.0-dev`（exit 100）：
#   Ubuntu 24.04 里这个包已不存在，且 lyco CLI 的依赖是
#   tera/rusqlite/serde/once_cell/toml/toml_edit —— 没有任何 GUI 依赖，压根不需要 webkit。
#
# 本 job 做的是「端到端」：真跑一次 lyco new 并校验产物。
# 模板是编译期内嵌的（ALL_TEMPLATES），所以这一步完全离线，不依赖网络。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # 中文注释/输出在这个仓里很常见，但 shell 里变量紧跟中文时（例如 echo 里写完
  # 变量名、紧接一个全角括号），macOS 自带的 bash 3.2 会把多字节字符的字节并进
  # 变量名，在 set -u 下报 `line N: rc<乱码>: unbound variable`；
  # ubuntu 的 bash 5 不复现 —— 所以这类 bug **只在 macOS 炸，评审时也看不出来**。
  # 实测踩过一次（见 §19），统一写成 ${VAR} 即可。
  workflow-shell-lint:
    name: 工作流 shell 片段可移植性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只扫会被执行的代码行；注释行不参与执行，跳过。
      - name: 校验没有「$VAR 紧跟非 ASCII」的写法
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          n=0
          while IFS= read -r f; do
            n=$((n + 1))
            hits="$(sed 's/\r$//' "$f" \
              | LC_ALL=C grep -nE '\$[A-Za-z_][A-Za-z0-9_]*[^ -~]' \
              | grep -vE '^[0-9]+:[[:space:]]*#' || true)"
            if [ -n "$hits" ]; then
              echo "❌ $f: 变量名后面紧跟了非 ASCII 字符"
              echo "$hits" | sed 's/^/    /'
              bad=1
            fi
          done < <(find .github/workflows -name '*.yml'; find . -name '*.sh' -not -path '*/target/*' -not -path './.git/*')
          # 防空转：一个文件都没扫到，说明 find 的路径已经不对了，别静默通过
          if [ "$n" -eq 0 ]; then
            echo "❌ 一个文件都没扫到 —— 检查 find 的路径是否还对"
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "  修法：把 \$VAR 写成 \${VAR}"
            exit 1
          fi
          echo "✅ 扫描 $n 个文件，没有「变量紧跟非 ASCII」的写法"

  lyco-e2e:
    name: lyco 端到端 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 lyco
        working-directory: demo/lyco-cli/lyco
        run: cargo build --release --locked

      - name: 生成项目并校验产物
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          test -x "$LYCO"
          TMP="$(mktemp -d)"
          cd "$TMP"
          "$LYCO" new hello c
          test -f hello/src/main.c
          test -f hello/Lyco.toml
          test -f hello/index.html
          grep -q 'name' hello/Lyco.toml
          echo "--- 生成的文件 ---"
          find hello -type f | sort

      - name: 校验命令行自省
        shell: bash
        run: |
          set -euo pipefail
          demo/lyco-cli/lyco/target/release/lyco list
          demo/lyco-cli/lyco/target/release/lyco info

      # 这个 job 跑在 ubuntu / macos 上 —— 正是 `lyco web` 原来必然失败的地方：
      # 它硬编码 `Command::new("python")`，而这两个系统通常只有 `python3`。
      # 而且失败被 `let _` 吞掉，用户会被告知「打开浏览器访问 http://localhost:8080」。
      - name: lyco web 真的能托管页面（且页面不再说谎）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          PORT=8137

          PORT="$PORT" "$LYCO" web > "$OUT/web.log" 2>&1 &
          WEB_PID=$!

          # 等它起来；进程死了就别再等
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/" -o "$OUT/page.html" 2>/dev/null; then break; fi
            kill -0 "$WEB_PID" 2>/dev/null || break
            sleep 0.5
          done
          kill "$WEB_PID" 2>/dev/null || true
          wait "$WEB_PID" 2>/dev/null || true

          echo "--- lyco web 的输出 ---"
          cat "$OUT/web.log"
          test -s "$OUT/page.html" || { echo "❌ lyco web 没能提供页面"; exit 1; }
          grep -q "Lyco WebView Studio" "$OUT/page.html" || { echo "❌ 页面内容不对"; exit 1; }

          # 页面是纯静态演示：既不该泄漏内网地址，也不该再谎报成功
          if grep -qE '192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+' "$OUT/page.html"; then
            echo "❌ 页面里泄漏了内网地址"; exit 1
          fi
          grep -q "UI 预览版" "$OUT/page.html" || { echo "❌ 页面缺少「UI 预览版」提示"; exit 1; }
          if grep -q "已创建!" "$OUT/page.html"; then echo "❌ 页面仍在谎报「已创建」"; exit 1; fi
          echo "✅ lyco web 正常，且页面不再说谎"

      # 反向断言：起不来的时候**必须明确失败**，不能打印地址然后返回 0。
      # PATH 指到空目录 = 机器上没有任何 python（ubuntu/macos 上没有 `py`）。
      - name: 找不到 python 时必须明确失败
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"

          set +e
          env PATH=/nonexistent HOME="$OUT/home" "$LYCO" web > "$OUT/log" 2>&1
          rc=$?
          set -e

          echo "--- 输出（退出码 ${rc}） ---"
          cat "$OUT/log"
          test "$rc" -ne 0 || { echo "❌ 找不到 python 时不该返回 0"; exit 1; }
          grep -q "未找到 python" "$OUT/log" || { echo "❌ 缺少明确提示"; exit 1; }
          if grep -q "localhost" "$OUT/log"; then echo "❌ 起不来时不该打印访问地址"; exit 1; fi
          echo "✅ 无 python 时正确失败，并给出了可操作的提示"

      # 回归防线：老用户必须能拿到新模板。
      # 版本戳原来只存 CARGO_PKG_VERSION —— 模板改了但 Cargo.toml 版本没动时
      # （很常见，比如只改 web.html 的文案），老用户永远拿不到新模板。
      # 实测现场：~/.lyco/web/index.html 里一直留着含开发机内网地址的旧页面，
      # 而 .version 还写着 1.2.0（= 当前版本），**而且完全静默、连提示都没有**。
      # 现在版本戳 = 版本号 + 模板内容指纹，这一条就是防它退回"只看版本号"。
      - name: 老用户的旧模板会被自动更新（版本戳含内容指纹）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          mkdir -p "$HOME/.lyco/templates" "$HOME/.lyco/web"

          # 造一个"老用户"现场：旧式版本戳（只有版本号）+ 旧模板
          printf '1.2.0' > "$HOME/.lyco/templates/.version"
          printf '<html>OLD PAGE http://192.168.10.165:8765</html>' > "$HOME/.lyco/web/index.html"
          printf '/* OLD-MARKER */' > "$HOME/.lyco/templates/main.c"

          cd "$OUT"
          "$LYCO" new demo c

          if grep -q "OLD PAGE" "$HOME/.lyco/web/index.html"; then
            echo "❌ 老用户的旧页面没被更新（版本戳是不是又只看版本号了？）"; exit 1
          fi
          grep -q "UI 预览版" "$HOME/.lyco/web/index.html" || { echo "❌ 新页面没到位"; exit 1; }
          if grep -q "OLD-MARKER" "$HOME/.lyco/templates/main.c"; then
            echo "❌ 模板没被更新"; exit 1
          fi
          grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{16}$' "$HOME/.lyco/templates/.version" \
            || { echo "❌ 版本戳里没有内容指纹"; exit 1; }

          # 幂等：再跑一次不该重复释放。指纹不稳定的话会每次都覆盖用户自定义。
          if "$LYCO" new demo2 c | grep -q "模板已更新"; then
            echo "❌ 第二次仍然重释放 —— 版本戳不稳定"; exit 1
          fi
          echo "✅ 老用户的旧模板被更新，且版本戳稳定（不重复释放）"

      # 上面那一条只保证「老用户能拿到新模板」；这一条保证**代价不是抹掉定制**。
      # 帮助文本明确邀请用户编辑 ~/.lyco/templates/ 定制，但原来的释放逻辑是
      # 「无条件覆盖」—— 任何一次模板更新都会把定制**无声**抹掉
      # （帮助里那句「升级前请备份」其实就是这个设计缺陷的自白）。
      # 现在按 `.manifest`（上次释放时各文件的哈希）区分：
      # 没动过的覆盖成新版，动过的保留并在输出里列出来。
      - name: 用户改过的模板不会被无声抹掉
        shell: bash
        run: |
          set -euo pipefail
          REPO="$PWD"
          LYCO="$REPO/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          MAN="$HOME/.lyco/templates/.manifest"
          mkdir -p "$HOME"
          cd "$OUT"

          # ① 先正常装一次，建立清单（14 个模板 + web/index.html）
          "$LYCO" new demo c
          test -f "$MAN" || { echo "❌ 没有生成 .manifest"; exit 1; }
          n="$(wc -l < "$MAN")"
          test "$n" -eq 15 || { echo "❌ 清单条目数不对: $n"; exit 1; }

          # ② 用户定制一个模板
          printf '/* USER-EDIT */\n' > "$HOME/.lyco/templates/main.c"

          # ③ 模拟「模板又更新了」：让版本戳失配（指纹一变就是这个效果）
          printf '1.2.0-0000000000000000' > "$HOME/.lyco/templates/.version"
          rm -rf demo2
          "$LYCO" new demo2 c > "$OUT/log" 2>&1
          cat "$OUT/log"

          grep -q 'USER-EDIT' "$HOME/.lyco/templates/main.c" \
            || { echo "❌ 用户定制被覆盖了"; exit 1; }
          grep -q '已保留未覆盖' "$OUT/log" \
            || { echo "❌ 保留/覆盖的结果没有告诉用户"; exit 1; }
          grep -q 'main.c' "$OUT/log" || { echo "❌ 没点名被保留的文件"; exit 1; }
          # 没改过的文件仍要拿到新版
          cmp -s "$REPO/demo/lyco-cli/lyco/templates/README.md" "$HOME/.lyco/templates/README.md" \
            || { echo "❌ 没改过的模板没被更新"; exit 1; }

          # ④ 清单损坏时必须自愈。否则每个文件都会落进「没有清单条目」那一支、
          #    被当成「用户改过」保留，清单又被重写成空 ——
          #    **模板更新从此永久失效**，而只打一行警告、不报错。
          printf 'garbage-without-tab\n' > "$MAN"
          printf '1.2.0-0000000000000000' > "$HOME/.lyco/templates/.version"
          rm -rf demo3
          "$LYCO" new demo3 c > /dev/null 2>&1
          n="$(wc -l < "$MAN")"
          test "$n" -eq 15 || { echo "❌ 清单损坏后没能自愈: $n 行"; exit 1; }
          # 不能用 grep -E '\t'（grep -E 不把 \t 当制表符，要 -P，而 macOS 没有 -P）
          awk -F"$(printf '\t')" '{ if (NF != 2 || length($1) != 16) bad = 1 } END { exit bad + 0 }' "$MAN" \
            || { echo "❌ 自愈后的清单格式不对"; exit 1; }

          echo "✅ 定制被保留并告知用户；清单损坏能自愈"

      # 上一条只保证「用户改过的文件被保留」。**保留**救不了另一种情形：
      # 我们主动覆盖掉一份**不同的**内容。有三条路会走到这里 ——
      #   ① 迁移：老用户本地没有清单，无从判断谁被改过，只能全按默认覆盖；
      #   ② 清单损坏自愈：同上（这是刻意的取舍，比"更新永久失效"好）；
      #   ③ 文件存在但**读不出来**（用户用 GBK 存了模板）→ 被当成"不存在"直接覆盖。
      # 这三条路上用户的数据会无声消失。所以覆盖前一律先备份到
      # ~/.lyco/backup/<旧版本戳>/ 并把路径打出来。
      - name: 覆盖前必须备份（迁移 / 清单损坏 / 非 UTF-8 都会丢内容）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          T="$HOME/.lyco/templates"
          BK="$HOME/.lyco/backup"
          mkdir -p "$T" "$HOME/.lyco/web"
          cd "$OUT"

          # ① 迁移：老用户只有旧式版本戳、没有清单 → 无从判断，会覆盖。
          #    覆盖掉的东西必须能找回，**含嵌套路径**（web/index.html）。
          #    备份布局**镜像 ~/.lyco/**（templates/… 与 web/…）——
          #    平铺布局下用户推不出文件该回到哪儿，restore 也就无从机械地放回去。
          printf '1.2.0' > "$T/.version"
          printf '/* OLD-MAIN-C 老用户的心血 */\n' > "$T/main.c"
          printf '<html>OLD-PAGE</html>' > "$HOME/.lyco/web/index.html"
          "$LYCO" new demo c > "$OUT/log1" 2>&1
          cat "$OUT/log1"
          grep -q '已备份到' "$OUT/log1" || { echo "❌ 覆盖了却没说备份到哪"; exit 1; }
          printf '/* OLD-MAIN-C 老用户的心血 */\n' > "$OUT/exp1"
          cmp -s "$OUT/exp1" "$BK/1.2.0/templates/main.c" \
            || { echo "❌ 老用户的 main.c 没被备份"; exit 1; }
          printf '<html>OLD-PAGE</html>' > "$OUT/exp2"
          cmp -s "$OUT/exp2" "$BK/1.2.0/web/index.html" \
            || { echo "❌ 嵌套路径 web/index.html 没被备份"; exit 1; }

          # ② 内容没变就不该备份 —— 备份是留给"真会丢的东西"的，别制造噪音
          rm -rf "$BK"
          printf '1.2.0-0000000000000000' > "$T/.version"
          "$LYCO" new demo2 c > "$OUT/log2" 2>&1
          if [ -e "$BK" ]; then echo "❌ 内容没变却产生了备份"; exit 1; fi

          # ③ 非 UTF-8：文件存在但读不出来。没有备份这一层，
          #    用户用 GBK 存的模板就被当成"不存在"直接覆盖、原字节无声丢掉。
          printf '\xd6\xd0\xce\xc4\xb2\xe2\xca\xd4' > "$T/main.c"
          before="$(wc -c < "$T/main.c" | tr -d ' ')"
          printf '1.2.0-0000000000000000' > "$T/.version"
          "$LYCO" new demo3 c > "$OUT/log3" 2>&1
          test -f "$BK/1.2.0-0000000000000000/templates/main.c" \
            || { echo "❌ 非 UTF-8 文件没被备份（原字节已丢）"; exit 1; }
          after="$(wc -c < "$BK/1.2.0-0000000000000000/templates/main.c" | tr -d ' ')"
          test "$after" -eq "$before" \
            || { echo "❌ 备份字节数不对: $before -> $after"; exit 1; }

          # ④ 清单损坏自愈那一次同样会覆盖 → 也要有备份
          rm -rf "$BK"
          printf '/* CUSTOM-X */\n' > "$T/main.c"
          printf 'garbage-without-tab\n' > "$T/.manifest"
          printf '1.2.0-0000000000000000' > "$T/.version"
          "$LYCO" new demo4 c > "$OUT/log4" 2>&1
          grep -q '注册表缺失或损坏' "$OUT/log4" || { echo "❌ 没说明为什么按默认覆盖"; exit 1; }
          printf '/* CUSTOM-X */\n' > "$OUT/exp4"
          cmp -s "$OUT/exp4" "$BK/1.2.0-0000000000000000/templates/main.c" \
            || { echo "❌ 清单损坏那次丢掉的定制没进备份"; exit 1; }

          # ⑤ 备份目录名来自**用户可写的文件**（.version），所以
          #    既不能穿出 backup/，也不能是隐藏目录 —— 隐藏目录用户 ls 看不见，
          #    等于没备份。
          rm -rf "$BK" "$T" "$HOME/.lyco/web"
          mkdir -p "$T" "$HOME/.lyco/web"
          printf '../evil' > "$T/.version"
          printf '/* OLD */\n' > "$T/main.c"
          "$LYCO" new demo5 c > "$OUT/log5" 2>&1
          if [ -e "$HOME/.lyco/evil" ]; then
            echo "❌ 备份跑出了 backup/（路径穿越）"; exit 1
          fi
          test -d "$BK/evil" \
            || { echo "❌ 备份目录名不对，实际: $(ls -A "$BK" 2>/dev/null | tr '\n' ' ')"; exit 1; }
          if ls -A "$BK" | grep -q '^\.'; then
            echo "❌ 备份目录是隐藏的（用户看不见自己的备份）"; exit 1
          fi

          # ⑥ 同一个旧戳被覆盖**两次** → 两份备份都必须留着。
          #    真实路径：清单损坏自愈、或 `~/.lyco` 只读导致版本戳写不进去时，
          #    每次运行都以为自己是"第一次"，都往同一个目录写备份 ——
          #    第二次的 fs::copy 会把第一次的备份盖掉，而那份可能是用户**唯一**的副本。
          rm -rf "$BK"
          printf 'garbage-without-tab\n' > "$T/.manifest"   # 清单坏 → 每次都按默认覆盖
          printf '1.2.0' > "$T/.version"
          printf '/* CUSTOM-A */\n' > "$T/main.c"
          "$LYCO" new demo6a c > "$OUT/log6a" 2>&1
          printf 'garbage-without-tab\n' > "$T/.manifest"   # 又坏（或压根写不进去）
          printf '1.2.0' > "$T/.version"                    # 戳也没更新（模拟只读目录）
          printf '/* CUSTOM-B */\n' > "$T/main.c"
          "$LYCO" new demo6b c > "$OUT/log6b" 2>&1

          printf '/* CUSTOM-A */\n' > "$OUT/exp6a"
          cmp -s "$OUT/exp6a" "$BK/1.2.0/templates/main.c" \
            || { echo "❌ 第一次的备份被第二次盖掉了（用户唯一的副本被毁）"; exit 1; }
          printf '/* CUSTOM-B */\n' > "$OUT/exp6b"
          cmp -s "$OUT/exp6b" "$BK/1.2.0-2/templates/main.c" \
            || { echo "❌ 第二次的备份不在 1.2.0-2（实际: $(ls -A "$BK" 2>/dev/null | tr '\n' ' ')）"; exit 1; }

          echo "✅ 覆盖前都会备份，且备份目录可发现、路径不可穿越、同戳重复覆盖不互相销毁"
      - name: 备份不会无限堆积（保留最近 N 份, 且只动自己的东西）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          T="$HOME/.lyco/templates"
          W="$HOME/.lyco/web"
          BK="$HOME/.lyco/backup"
          mkdir -p "$T" "$W"
          cd "$OUT"

          # ① 真实产生一份备份（老用户现场），并检查自述文件
          printf '1.2.0' > "$T/.version"
          printf '/* OLD-MAIN-C */\n' > "$T/main.c"
          printf '<html>OLD-PAGE</html>' > "$W/index.html"
          "$LYCO" new demo c > "$OUT/log1" 2>&1
          REAL="$(ls -A "$BK" 2>/dev/null | head -1)"
          test -n "$REAL" || { echo "❌ 没有产生备份"; exit 1; }
          test -f "$BK/$REAL/.meta" || { echo "❌ 备份里没有 .meta（用户看不懂这是哪一版留下的）"; exit 1; }
          grep -q '^created=' "$BK/$REAL/.meta" || { echo "❌ .meta 缺 created="; exit 1; }
          grep -q '^replaced_by=1.2.0-' "$BK/$REAL/.meta" || { echo "❌ .meta 缺 replaced_by（应写新版戳）"; exit 1; }

          # ② 塞 12 份"更早的"备份（created 递增，便于断言删的是**最旧的**），
          #    外加两份"不是我们的东西"：用户自己的目录 + 一个散落文件。
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            d="$BK/1.0.$i-aaaaaaaaaaaaaa$i"
            mkdir -p "$d"
            printf 'created=1000000%s\nreplaced_by=x\n' "$i" > "$d/.meta"
          done
          mkdir -p "$BK/my-own-notes"
          printf 'do not touch\n' > "$BK/my-own-notes/keep.txt"
          printf 'stray\n' > "$BK/readme.txt"

          # 触发一次释放（把戳改回旧值即可）→ 顺带触发清理
          printf '1.2.0' > "$T/.version"
          "$LYCO" new demo2 c > "$OUT/log2" 2>&1
          cat "$OUT/log2"

          # ③ 默认保留 10 份：12 假 + 1 真 = 13 → 删最旧的 3 份（created 01/02/03）。
          #    最要紧的是**别把最新的删掉** —— 排序反了就会删掉刚备份出来的那份。
          test -d "$BK/$REAL" || { echo "❌ 最新的那份备份被删了（排序反了？）"; exit 1; }
          test -d "$BK/1.0.12-aaaaaaaaaaaaaa12" || { echo "❌ 第二新的备份被删了"; exit 1; }
          test -d "$BK/1.0.04-aaaaaaaaaaaaaa04" || { echo "❌ 保留了太旧的备份（应该只留 10 份）"; exit 1; }
          for i in 01 02 03; do
            if [ -e "$BK/1.0.$i-aaaaaaaaaaaaaa$i" ]; then
              echo "❌ 最旧的 1.0.$i 没被清理（保留数没生效？）"; exit 1
            fi
          done
          grep -q '已清理 3 份' "$OUT/log2" || { echo "❌ 清理了却没告诉用户"; exit 1; }
          grep -q 'LYCO_BACKUP_KEEP=0' "$OUT/log2" || { echo "❌ 没说怎么关掉自动清理"; exit 1; }

          # ④ 只动自己的东西：用户在 backup/ 里放的东西必须原封不动。
          #    只靠名字区分不了（my-own-notes 也是合法的 sanitize 结果），
          #    真正的判据是「有没有我们写的 .meta」。
          test -f "$BK/my-own-notes/keep.txt" || { echo "❌ 删了用户在 backup/ 里自己放的东西"; exit 1; }
          test -f "$BK/readme.txt" || { echo "❌ 删了 backup/ 里的散落文件"; exit 1; }

          # ⑤ LYCO_BACKUP_KEEP=0 → 全部保留（逃生通道）
          before_n="$(ls -A "$BK" | wc -l | tr -d ' ')"
          printf '1.2.0' > "$T/.version"
          LYCO_BACKUP_KEEP=0 "$LYCO" new demo3 c > "$OUT/log3" 2>&1
          after_n="$(ls -A "$BK" | wc -l | tr -d ' ')"
          test "$after_n" -eq "$before_n" \
            || { echo "❌ LYCO_BACKUP_KEEP=0 时仍被清理: $before_n -> $after_n"; exit 1; }
          if grep -q '已清理' "$OUT/log3"; then echo "❌ 关掉了清理却仍报告清理"; exit 1; fi

          # ⑥ reset 不该剪掉安全网：备份可能是用户唯一的恢复副本
          "$LYCO" reset > "$OUT/log4" 2>&1
          test -d "$BK" || { echo "❌ lyco reset 把模板备份一起删了（那是唯一的恢复副本）"; exit 1; }
          test -f "$BK/$REAL/.meta" || { echo "❌ reset 后备份内容不完整"; exit 1; }
          grep -q '模板备份已保留' "$OUT/log4" || { echo "❌ reset 没说备份被保留了"; exit 1; }
          if [ -f "$T/main.c" ]; then echo "❌ reset 没有清掉模板"; exit 1; fi

          echo "✅ 备份有保留上限、可关闭、只动自己的东西，且 reset 不剪安全网"
      # 上一条保证「覆盖前会备份」，这一条保证「备份能真的放回去」——
      # 只能看不能用的备份，仍然等于没有备份。
      - name: 备份能真的放回去（lyco restore）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          T="$HOME/.lyco/templates"
          W="$HOME/.lyco/web"
          BK="$HOME/.lyco/backup"
          mkdir -p "$T" "$W"
          cd "$OUT"

          # ① 造一份真实备份：老用户迁移（只有旧式版本戳、没有清单）→ 覆盖前会备份。
          #    备份布局**镜像 ~/.lyco/**：模板在 templates/ 下、网页在 web/ 下。
          #    这是「可恢复」的前提 —— 平铺布局下用户看到 backup/1.2.0/main.c 与
          #    backup/1.2.0/web/index.html，推不出各自该回到哪儿。
          printf '1.2.0' > "$T/.version"
          printf '/* USER-ORIGINAL */\n' > "$T/main.c"
          printf '<html>USER-PAGE</html>' > "$W/index.html"
          "$LYCO" new demo c > "$OUT/log1" 2>&1
          cat "$OUT/log1"
          test -f "$BK/1.2.0/templates/main.c" || { echo "❌ 备份没镜像 templates/"; exit 1; }
          test -f "$BK/1.2.0/web/index.html" || { echo "❌ 备份没镜像 web/"; exit 1; }

          # ② 不带参数 = 列出可用备份：名字、文件数、多久以前、被谁替换
          "$LYCO" restore > "$OUT/list" 2>&1
          cat "$OUT/list"
          grep -q '可用备份' "$OUT/list" || { echo "❌ 没列出可用备份"; exit 1; }
          grep -q '1.2.0' "$OUT/list" || { echo "❌ 列表里没有 1.2.0"; exit 1; }
          grep -q '个文件' "$OUT/list" || { echo "❌ 列表没显示文件数"; exit 1; }
          grep -q '用法: lyco restore' "$OUT/list" || { echo "❌ 没告诉用户怎么用"; exit 1; }

          # ③ 把当前模板改成与备份不同（模拟用户后来手改了），再恢复
          printf '/* CURRENT-DIFFERENT */\n' > "$T/main.c"
          printf '<html>CURRENT-PAGE</html>' > "$W/index.html"
          "$LYCO" restore 1.2.0 > "$OUT/r1" 2>&1
          cat "$OUT/r1"
          grep -q '已从备份' "$OUT/r1" || { echo "❌ 没说恢复了什么"; exit 1; }
          printf '/* USER-ORIGINAL */\n' > "$OUT/exp_c"
          cmp -s "$OUT/exp_c" "$T/main.c" || { echo "❌ templates/main.c 没被恢复"; exit 1; }
          printf '<html>USER-PAGE</html>' > "$OUT/exp_w"
          cmp -s "$OUT/exp_w" "$W/index.html" \
            || { echo "❌ 嵌套路径 web/index.html 没被恢复（镜像布局没生效）"; exit 1; }

          # ④ 恢复本身也不能不可逆：覆盖前先把「现状」存下来
          grep -q '恢复前的内容已先存到' "$OUT/r1" || { echo "❌ 没提示恢复前的现状被存下来了"; exit 1; }
          PRE="$(ls -d "$BK"/pre-restore-* 2>/dev/null | head -1 || true)"
          test -n "$PRE" || { echo "❌ 没生成 pre-restore 目录"; exit 1; }
          printf '/* CURRENT-DIFFERENT */\n' > "$OUT/exp_pre"
          cmp -s "$OUT/exp_pre" "$PRE/templates/main.c" \
            || { echo "❌ 恢复前的现状没被存下来（恢复成了不可逆操作）"; exit 1; }
          printf '<html>CURRENT-PAGE</html>' > "$OUT/exp_pre_w"
          cmp -s "$OUT/exp_pre_w" "$PRE/web/index.html" \
            || { echo "❌ 恢复前的 web/index.html 没被存下来"; exit 1; }

          # ⑤ 不碰 .version / .manifest，且必须说明后果 —— 否则用户会以为
          #    「恢复过 = 一切照旧」，而实际上这些文件之后会被当成「你改过的」保留。
          grep -q '没有改动' "$OUT/r1" || { echo "❌ 没说明 .version/.manifest 未被改动"; exit 1; }
          test -f "$T/.manifest" || { echo "❌ .manifest 被动了"; exit 1; }
          test -f "$T/.version" || { echo "❌ .version 被动了"; exit 1; }

          # ⑥ 非法名字 / 不存在的名字：明确失败 + 给出可操作提示 + 退出码 1
          if "$LYCO" restore ../evil > "$OUT/e1" 2>&1; then
            echo "❌ 非法备份名居然成功了"; exit 1
          fi
          grep -q '备份名不合法' "$OUT/e1" || { echo "❌ 非法名字的提示不对"; exit 1; }
          grep -q 'lyco restore' "$OUT/e1" || { echo "❌ 没告诉用户怎么查可用名字"; exit 1; }
          test ! -e "$HOME/.lyco/evil" || { echo "❌ 恢复路径穿越了 backup/"; exit 1; }

          if "$LYCO" restore no-such-backup > "$OUT/e2" 2>&1; then
            echo "❌ 不存在的备份居然成功了"; exit 1
          fi
          grep -q '找不到备份' "$OUT/e2" || { echo "❌ 不存在时的提示不对"; exit 1; }

          # ⑦ 用户在 backup/ 里自己放的东西：不列出、也不碰（没有 .meta = 不是我们的）
          mkdir -p "$BK/my-notes"
          printf 'keep\n' > "$BK/my-notes/keep.txt"
          "$LYCO" restore > "$OUT/list2" 2>&1
          if grep -q 'my-notes' "$OUT/list2"; then
            echo "❌ 把用户自己放的东西也列成备份了"; exit 1
          fi
          test -f "$BK/my-notes/keep.txt" || { echo "❌ 动了用户自己放的东西"; exit 1; }

          # ⑧ 同一个旧戳被覆盖两次 → 两份都在列表里，且各自能恢复回**自己**那一份。
          #    这是 ⑥（上一条防线）的「可用性」侧：不只不能丢，还得能分辨出要的是哪一份。
          rm -rf "$BK"
          printf 'garbage-without-tab\n' > "$T/.manifest"
          printf '1.2.0' > "$T/.version"
          printf '/* ROUND-A */\n' > "$T/main.c"
          "$LYCO" new demo8a c > "$OUT/log8a" 2>&1
          printf 'garbage-without-tab\n' > "$T/.manifest"
          printf '1.2.0' > "$T/.version"
          printf '/* ROUND-B */\n' > "$T/main.c"
          "$LYCO" new demo8b c > "$OUT/log8b" 2>&1

          "$LYCO" restore > "$OUT/list3" 2>&1
          grep -q '1.2.0-2' "$OUT/list3" \
            || { echo "❌ 第二次的备份没出现在列表里"; cat "$OUT/list3"; exit 1; }

          "$LYCO" restore 1.2.0 > /dev/null 2>&1
          printf '/* ROUND-A */\n' > "$OUT/exp8a"
          cmp -s "$OUT/exp8a" "$T/main.c" \
            || { echo "❌ 恢复 1.2.0 拿到的不是第一次那份"; exit 1; }

          "$LYCO" restore 1.2.0-2 > /dev/null 2>&1
          printf '/* ROUND-B */\n' > "$OUT/exp8b"
          cmp -s "$OUT/exp8b" "$T/main.c" \
            || { echo "❌ 恢复 1.2.0-2 拿到的不是第二次那份"; exit 1; }

          echo "✅ 备份可恢复：布局镜像、恢复前先存现状、不碰版本戳、非法名字被拒、不动用户的杂物、同戳多份可分辨"

      # 这一条守的是「不许谎报成功」。`lyco build` / `run` / `clean` / `update`
      # 原来把子进程退出码整个吞掉（`let _ = …status()`），再无条件打印
      # 「✅ 完成」：编译失败报成功，连「一个工程文件都没有、压根没干活」也报
      # 成功 —— 而且这两种情况的输出**一模一样**，用户根本分不出自己属于哪种。
      #
      # 每条都用 `env PATH=/nonexistent` 跑：这样 xmake 一定找不到，断言就不依赖
      # 「runner 上装没装 xmake」，每次都必然走到失败分支 —— 不是可能空转的断言。
      - name: 构建/运行/清除失败不许报成功
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          W="$(mktemp -d)"
          export HOME="$W/home"
          mkdir -p "$HOME"
          NO="/nonexistent"

          # ① 没有工程文件：必须失败，并说清为什么（不能静默成功）
          mkdir -p "$W/emptyproj"
          if (cd "$W/emptyproj" && env PATH="$NO" "$LYCO" build) > "$W/o1" 2>&1; then
            echo "❌ 没有工程文件时 lyco build 却成功了"; cat "$W/o1"; exit 1
          fi
          grep -q '没有可构建的工程' "$W/o1" || { echo "❌ 没说清为什么不能构建"; cat "$W/o1"; exit 1; }

          # ② xmake 跑不起来：必须失败，且**不许**出现「✅ 完成」
          mkdir -p "$W/badproj"
          printf 'this is not valid lua @@@\n' > "$W/badproj/xmake.lua"
          if (cd "$W/badproj" && env PATH="$NO" "$LYCO" build) > "$W/o2" 2>&1; then
            echo "❌ 构建失败时 lyco build 却报成功"; cat "$W/o2"; exit 1
          fi
          if grep -q '✅ 完成' "$W/o2"; then
            echo "❌ 构建失败却打印了「✅ 完成」"; cat "$W/o2"; exit 1
          fi
          grep -qE 'xmake.*失败|无法执行 xmake' "$W/o2" || { echo "❌ 构建失败没有说明原因"; cat "$W/o2"; exit 1; }

          # ③ 构建失败时 lyco run 不许继续假装要运行
          if (cd "$W/badproj" && env PATH="$NO" "$LYCO" run) > "$W/o3" 2>&1; then
            echo "❌ 构建失败时 lyco run 却成功"; cat "$W/o3"; exit 1
          fi

          # ④ lyco clean：build 是个**文件**（删目录必然失败）→ 必须报失败
          mkdir -p "$W/cleanproj"
          : > "$W/cleanproj/build"
          if (cd "$W/cleanproj" && env PATH="$NO" "$LYCO" clean) > "$W/o4" 2>&1; then
            echo "❌ 清除失败时 lyco clean 却报成功"; cat "$W/o4"; exit 1
          fi
          grep -q '没能清除' "$W/o4" || { echo "❌ 清除失败没有说明原因"; cat "$W/o4"; exit 1; }

          # ⑤ lyco update：退出码与输出必须自洽。旧行为是「失败也退出码 0、一声不吭」，
          #    所以这条**不是重言式** —— 它专门抓「退出码 0 却什么都没报告」。
          if (cd "$W" && env PATH="$NO" "$LYCO" update) > "$W/o5" 2>&1; then
            grep -q '已更新' "$W/o5" || { echo "❌ lyco update 退出码 0 却没报告更新成功"; cat "$W/o5"; exit 1; }
          else
            grep -qE 'repo -u.*失败|无法执行' "$W/o5" || { echo "❌ lyco update 失败却没说原因"; cat "$W/o5"; exit 1; }
          fi

          echo "✅ 失败不再静默：没工程 / 编译失败 / 清除失败 / 更新失败都如实上报，退出码非 0"

      # 上一条管「命令失败不许报成功」，这一条管**服务/进程的失败不许被静默掉**。
      # 两处判据原来都是错的：
      #   * `lyco web` 用 `status().is_ok()` 判服务起没起来 —— `is_ok()` 只说明
      #     「进程能启动、并且跑完了」，**完全没看退出码**。端口被占用时
      #     http.server 立刻以 1 退出，`is_ok()` 照样为真，于是「服务已经死了」
      #     被报成「起来了」；而且访问地址是在起服务**之前**就打出去的。
      #   * 插件派发用 `.status().unwrap()` —— 插件存在但没有执行权限
      #     （Linux/macOS 上忘了 `chmod +x` 是常事）直接 panic，甩一屏 backtrace。
      - name: 服务起不来 / 插件跑不起来都要说人话
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          W="$(mktemp -d)"
          export HOME="$W/home"
          mkdir -p "$HOME"

          # ① 端口非法（99999 超出 0-65535，http.server 必然拒绝启动）→ 必须失败，
          #    且**不许**打印一个连不上的访问地址（那是把用户送去一个死页面）。
          #    为什么不用「1 端口」：Windows 上普通用户**能**绑低端口，那个前提不成立；
          #    为什么不用「被占用的端口」：得起占位进程并保证清理，多一份不确定性。
          if (cd "$W" && env PORT=99999 "$LYCO" web) > "$W/w1" 2>&1; then
            echo "❌ 端口起不来时 lyco web 却成功了"; cat "$W/w1"; exit 1
          fi
          grep -q '本地服务器没能起来' "$W/w1" || { echo "❌ 没说清服务没起来"; cat "$W/w1"; exit 1; }
          if grep -q 'http://localhost' "$W/w1"; then
            echo "❌ 起不来却打印了访问地址（用户会去访问一个死页面）"; cat "$W/w1"; exit 1
          fi

          # ② 插件本体 + 可执行文件都在，但可执行文件没有执行位 → 必须给人话，
          #    不许 panic（旧代码是 `.status().unwrap()`）
          CMDS="$HOME/.lyco/commands"
          mkdir -p "$CMDS"
          : > "$CMDS/myplug.so"                  # 标记文件（非 Windows 平台用 .so）
          printf '#!/bin/sh\necho hi\n' > "$CMDS/myplug"
          chmod 644 "$CMDS/myplug"               # 故意不给执行位
          rc=0; out=$(cd "$W" && "$LYCO" myplug 2>&1) || rc=$?
          [ "$rc" -ne 0 ] || { echo "❌ 插件不可执行时 lyco 却成功了"; printf '%s\n' "$out"; exit 1; }
          if printf '%s' "$out" | grep -q 'panicked'; then
            echo "❌ 插件不可执行时 panic 了（应该给人话）"; printf '%s\n' "$out"; exit 1
          fi
          printf '%s' "$out" | grep -q '无法执行插件' \
            || { echo "❌ 没说明插件为什么跑不起来"; printf '%s\n' "$out"; exit 1; }

          echo "✅ 服务起不来时不给死地址、插件跑不起来时给人话（不 panic）"
