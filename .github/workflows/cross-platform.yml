name: Cross-Platform CI

# 原来三个 job 全部 working-directory: lyco-webview/lyco —— 这个目录不存在
# （真实路径是 demo/lyco-cli/lyco），所以 macos 直接
#   An error occurred trying to start process '/bin/bash' with working directory
#   '.../lyco-webview/lyco'. No such file or directory
# 而 linux 更早一步就死在 `apt-get install libwebkit2gtk-4.0-dev`（exit 100）：
#   Ubuntu 24.04 里这个包已不存在，且 lyco CLI 的依赖是
#   tera/rusqlite/serde/once_cell/toml/toml_edit —— 没有任何 GUI 依赖，压根不需要 webkit。
#
# 本 job 做的是「端到端」：真跑一次 lyco new 并校验产物。
# 模板是编译期内嵌的（ALL_TEMPLATES），所以这一步完全离线，不依赖网络。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # 中文注释/输出在这个仓里很常见，但 shell 里变量紧跟中文时（例如 echo 里写完
  # 变量名、紧接一个全角括号），macOS 自带的 bash 3.2 会把多字节字符的字节并进
  # 变量名，在 set -u 下报 `line N: rc<乱码>: unbound variable`；
  # ubuntu 的 bash 5 不复现 —— 所以这类 bug **只在 macOS 炸，评审时也看不出来**。
  # 实测踩过一次（见 §19），统一写成 ${VAR} 即可。
  workflow-shell-lint:
    name: 工作流 shell 片段可移植性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只扫会被执行的代码行；注释行不参与执行，跳过。
      - name: 校验没有「$VAR 紧跟非 ASCII」的写法
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          n=0
          while IFS= read -r f; do
            n=$((n + 1))
            hits="$(sed 's/\r$//' "$f" \
              | LC_ALL=C grep -nE '\$[A-Za-z_][A-Za-z0-9_]*[^ -~]' \
              | grep -vE '^[0-9]+:[[:space:]]*#' || true)"
            if [ -n "$hits" ]; then
              echo "❌ $f: 变量名后面紧跟了非 ASCII 字符"
              echo "$hits" | sed 's/^/    /'
              bad=1
            fi
          done < <(find .github/workflows -name '*.yml'; find . -name '*.sh' -not -path '*/target/*' -not -path './.git/*')
          # 防空转：一个文件都没扫到，说明 find 的路径已经不对了，别静默通过
          if [ "$n" -eq 0 ]; then
            echo "❌ 一个文件都没扫到 —— 检查 find 的路径是否还对"
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "  修法：把 \$VAR 写成 \${VAR}"
            exit 1
          fi
          echo "✅ 扫描 $n 个文件，没有「变量紧跟非 ASCII」的写法"

  lyco-e2e:
    name: lyco 端到端 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 lyco
        working-directory: demo/lyco-cli/lyco
        run: cargo build --release --locked

      - name: 生成项目并校验产物
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          test -x "$LYCO"
          TMP="$(mktemp -d)"
          cd "$TMP"
          "$LYCO" new hello c
          test -f hello/src/main.c
          test -f hello/Lyco.toml
          test -f hello/index.html
          grep -q 'name' hello/Lyco.toml
          echo "--- 生成的文件 ---"
          find hello -type f | sort

      - name: 校验命令行自省
        shell: bash
        run: |
          set -euo pipefail
          demo/lyco-cli/lyco/target/release/lyco list
          demo/lyco-cli/lyco/target/release/lyco info

      # 这个 job 跑在 ubuntu / macos 上 —— 正是 `lyco web` 原来必然失败的地方：
      # 它硬编码 `Command::new("python")`，而这两个系统通常只有 `python3`。
      # 而且失败被 `let _` 吞掉，用户会被告知「打开浏览器访问 http://localhost:8080」。
      - name: lyco web 真的能托管页面（且页面不再说谎）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          PORT=8137

          PORT="$PORT" "$LYCO" web > "$OUT/web.log" 2>&1 &
          WEB_PID=$!

          # 等它起来；进程死了就别再等
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/" -o "$OUT/page.html" 2>/dev/null; then break; fi
            kill -0 "$WEB_PID" 2>/dev/null || break
            sleep 0.5
          done
          kill "$WEB_PID" 2>/dev/null || true
          wait "$WEB_PID" 2>/dev/null || true

          echo "--- lyco web 的输出 ---"
          cat "$OUT/web.log"
          test -s "$OUT/page.html" || { echo "❌ lyco web 没能提供页面"; exit 1; }
          grep -q "Lyco WebView Studio" "$OUT/page.html" || { echo "❌ 页面内容不对"; exit 1; }

          # 页面是纯静态演示：既不该泄漏内网地址，也不该再谎报成功
          if grep -qE '192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+' "$OUT/page.html"; then
            echo "❌ 页面里泄漏了内网地址"; exit 1
          fi
          grep -q "UI 预览版" "$OUT/page.html" || { echo "❌ 页面缺少「UI 预览版」提示"; exit 1; }
          if grep -q "已创建!" "$OUT/page.html"; then echo "❌ 页面仍在谎报「已创建」"; exit 1; fi
          echo "✅ lyco web 正常，且页面不再说谎"

      # 反向断言：起不来的时候**必须明确失败**，不能打印地址然后返回 0。
      # PATH 指到空目录 = 机器上没有任何 python（ubuntu/macos 上没有 `py`）。
      - name: 找不到 python 时必须明确失败
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"

          set +e
          env PATH=/nonexistent HOME="$OUT/home" "$LYCO" web > "$OUT/log" 2>&1
          rc=$?
          set -e

          echo "--- 输出（退出码 ${rc}） ---"
          cat "$OUT/log"
          test "$rc" -ne 0 || { echo "❌ 找不到 python 时不该返回 0"; exit 1; }
          grep -q "未找到 python" "$OUT/log" || { echo "❌ 缺少明确提示"; exit 1; }
          if grep -q "localhost" "$OUT/log"; then echo "❌ 起不来时不该打印访问地址"; exit 1; fi
          echo "✅ 无 python 时正确失败，并给出了可操作的提示"

      # 回归防线：老用户必须能拿到新模板。
      # 版本戳原来只存 CARGO_PKG_VERSION —— 模板改了但 Cargo.toml 版本没动时
      # （很常见，比如只改 web.html 的文案），老用户永远拿不到新模板。
      # 实测现场：~/.lyco/web/index.html 里一直留着含开发机内网地址的旧页面，
      # 而 .version 还写着 1.2.0（= 当前版本），**而且完全静默、连提示都没有**。
      # 现在版本戳 = 版本号 + 模板内容指纹，这一条就是防它退回"只看版本号"。
      - name: 老用户的旧模板会被自动更新（版本戳含内容指纹）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          mkdir -p "$HOME/.lyco/templates" "$HOME/.lyco/web"

          # 造一个"老用户"现场：旧式版本戳（只有版本号）+ 旧模板
          printf '1.2.0' > "$HOME/.lyco/templates/.version"
          printf '<html>OLD PAGE http://192.168.10.165:8765</html>' > "$HOME/.lyco/web/index.html"
          printf '/* OLD-MARKER */' > "$HOME/.lyco/templates/main.c"

          cd "$OUT"
          "$LYCO" new demo c

          if grep -q "OLD PAGE" "$HOME/.lyco/web/index.html"; then
            echo "❌ 老用户的旧页面没被更新（版本戳是不是又只看版本号了？）"; exit 1
          fi
          grep -q "UI 预览版" "$HOME/.lyco/web/index.html" || { echo "❌ 新页面没到位"; exit 1; }
          if grep -q "OLD-MARKER" "$HOME/.lyco/templates/main.c"; then
            echo "❌ 模板没被更新"; exit 1
          fi
          grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{16}$' "$HOME/.lyco/templates/.version" \
            || { echo "❌ 版本戳里没有内容指纹"; exit 1; }

          # 幂等：再跑一次不该重复释放。指纹不稳定的话会每次都覆盖用户自定义。
          if "$LYCO" new demo2 c | grep -q "模板已更新"; then
            echo "❌ 第二次仍然重释放 —— 版本戳不稳定"; exit 1
          fi
          echo "✅ 老用户的旧模板被更新，且版本戳稳定（不重复释放）"

      # 上面那一条只保证「老用户能拿到新模板」；这一条保证**代价不是抹掉定制**。
      # 帮助文本明确邀请用户编辑 ~/.lyco/templates/ 定制，但原来的释放逻辑是
      # 「无条件覆盖」—— 任何一次模板更新都会把定制**无声**抹掉
      # （帮助里那句「升级前请备份」其实就是这个设计缺陷的自白）。
      # 现在按 `.manifest`（上次释放时各文件的哈希）区分：
      # 没动过的覆盖成新版，动过的保留并在输出里列出来。
      - name: 用户改过的模板不会被无声抹掉
        shell: bash
        run: |
          set -euo pipefail
          REPO="$PWD"
          LYCO="$REPO/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          MAN="$HOME/.lyco/templates/.manifest"
          mkdir -p "$HOME"
          cd "$OUT"

          # ① 先正常装一次，建立清单（14 个模板 + web/index.html）
          "$LYCO" new demo c
          test -f "$MAN" || { echo "❌ 没有生成 .manifest"; exit 1; }
          n="$(wc -l < "$MAN")"
          test "$n" -eq 15 || { echo "❌ 清单条目数不对: $n"; exit 1; }

          # ② 用户定制一个模板
          printf '/* USER-EDIT */\n' > "$HOME/.lyco/templates/main.c"

          # ③ 模拟「模板又更新了」：让版本戳失配（指纹一变就是这个效果）
          printf '1.2.0-0000000000000000' > "$HOME/.lyco/templates/.version"
          rm -rf demo2
          "$LYCO" new demo2 c > "$OUT/log" 2>&1
          cat "$OUT/log"

          grep -q 'USER-EDIT' "$HOME/.lyco/templates/main.c" \
            || { echo "❌ 用户定制被覆盖了"; exit 1; }
          grep -q '已保留未覆盖' "$OUT/log" \
            || { echo "❌ 保留/覆盖的结果没有告诉用户"; exit 1; }
          grep -q 'main.c' "$OUT/log" || { echo "❌ 没点名被保留的文件"; exit 1; }
          # 没改过的文件仍要拿到新版
          cmp -s "$REPO/demo/lyco-cli/lyco/templates/README.md" "$HOME/.lyco/templates/README.md" \
            || { echo "❌ 没改过的模板没被更新"; exit 1; }

          # ④ 清单损坏时必须自愈。否则每个文件都会落进「没有清单条目」那一支、
          #    被当成「用户改过」保留，清单又被重写成空 ——
          #    **模板更新从此永久失效**，而只打一行警告、不报错。
          printf 'garbage-without-tab\n' > "$MAN"
          printf '1.2.0-0000000000000000' > "$HOME/.lyco/templates/.version"
          rm -rf demo3
          "$LYCO" new demo3 c > /dev/null 2>&1
          n="$(wc -l < "$MAN")"
          test "$n" -eq 15 || { echo "❌ 清单损坏后没能自愈: $n 行"; exit 1; }
          # 不能用 grep -E '\t'（grep -E 不把 \t 当制表符，要 -P，而 macOS 没有 -P）
          awk -F"$(printf '\t')" '{ if (NF != 2 || length($1) != 16) bad = 1 } END { exit bad + 0 }' "$MAN" \
            || { echo "❌ 自愈后的清单格式不对"; exit 1; }

          echo "✅ 定制被保留并告知用户；清单损坏能自愈"

      # 上一条只保证「用户改过的文件被保留」。**保留**救不了另一种情形：
      # 我们主动覆盖掉一份**不同的**内容。有三条路会走到这里 ——
      #   ① 迁移：老用户本地没有清单，无从判断谁被改过，只能全按默认覆盖；
      #   ② 清单损坏自愈：同上（这是刻意的取舍，比"更新永久失效"好）；
      #   ③ 文件存在但**读不出来**（用户用 GBK 存了模板）→ 被当成"不存在"直接覆盖。
      # 这三条路上用户的数据会无声消失。所以覆盖前一律先备份到
      # ~/.lyco/backup/<旧版本戳>/ 并把路径打出来。
      - name: 覆盖前必须备份（迁移 / 清单损坏 / 非 UTF-8 都会丢内容）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          T="$HOME/.lyco/templates"
          BK="$HOME/.lyco/backup"
          mkdir -p "$T" "$HOME/.lyco/web"
          cd "$OUT"

          # ① 迁移：老用户只有旧式版本戳、没有清单 → 无从判断，会覆盖。
          #    覆盖掉的东西必须能找回，**含嵌套路径**（web/index.html）。
          printf '1.2.0' > "$T/.version"
          printf '/* OLD-MAIN-C 老用户的心血 */\n' > "$T/main.c"
          printf '<html>OLD-PAGE</html>' > "$HOME/.lyco/web/index.html"
          "$LYCO" new demo c > "$OUT/log1" 2>&1
          cat "$OUT/log1"
          grep -q '已备份到' "$OUT/log1" || { echo "❌ 覆盖了却没说备份到哪"; exit 1; }
          printf '/* OLD-MAIN-C 老用户的心血 */\n' > "$OUT/exp1"
          cmp -s "$OUT/exp1" "$BK/1.2.0/main.c" \
            || { echo "❌ 老用户的 main.c 没被备份"; exit 1; }
          printf '<html>OLD-PAGE</html>' > "$OUT/exp2"
          cmp -s "$OUT/exp2" "$BK/1.2.0/web/index.html" \
            || { echo "❌ 嵌套路径 web/index.html 没被备份"; exit 1; }

          # ② 内容没变就不该备份 —— 备份是留给"真会丢的东西"的，别制造噪音
          rm -rf "$BK"
          printf '1.2.0-0000000000000000' > "$T/.version"
          "$LYCO" new demo2 c > "$OUT/log2" 2>&1
          if [ -e "$BK" ]; then echo "❌ 内容没变却产生了备份"; exit 1; fi

          # ③ 非 UTF-8：文件存在但读不出来。没有备份这一层，
          #    用户用 GBK 存的模板就被当成"不存在"直接覆盖、原字节无声丢掉。
          printf '\xd6\xd0\xce\xc4\xb2\xe2\xca\xd4' > "$T/main.c"
          before="$(wc -c < "$T/main.c" | tr -d ' ')"
          printf '1.2.0-0000000000000000' > "$T/.version"
          "$LYCO" new demo3 c > "$OUT/log3" 2>&1
          test -f "$BK/1.2.0-0000000000000000/main.c" \
            || { echo "❌ 非 UTF-8 文件没被备份（原字节已丢）"; exit 1; }
          after="$(wc -c < "$BK/1.2.0-0000000000000000/main.c" | tr -d ' ')"
          test "$after" -eq "$before" \
            || { echo "❌ 备份字节数不对: $before -> $after"; exit 1; }

          # ④ 清单损坏自愈那一次同样会覆盖 → 也要有备份
          rm -rf "$BK"
          printf '/* CUSTOM-X */\n' > "$T/main.c"
          printf 'garbage-without-tab\n' > "$T/.manifest"
          printf '1.2.0-0000000000000000' > "$T/.version"
          "$LYCO" new demo4 c > "$OUT/log4" 2>&1
          grep -q '注册表缺失或损坏' "$OUT/log4" || { echo "❌ 没说明为什么按默认覆盖"; exit 1; }
          printf '/* CUSTOM-X */\n' > "$OUT/exp4"
          cmp -s "$OUT/exp4" "$BK/1.2.0-0000000000000000/main.c" \
            || { echo "❌ 清单损坏那次丢掉的定制没进备份"; exit 1; }

          # ⑤ 备份目录名来自**用户可写的文件**（.version），所以
          #    既不能穿出 backup/，也不能是隐藏目录 —— 隐藏目录用户 ls 看不见，
          #    等于没备份。
          rm -rf "$BK" "$T" "$HOME/.lyco/web"
          mkdir -p "$T" "$HOME/.lyco/web"
          printf '../evil' > "$T/.version"
          printf '/* OLD */\n' > "$T/main.c"
          "$LYCO" new demo5 c > "$OUT/log5" 2>&1
          if [ -e "$HOME/.lyco/evil" ]; then
            echo "❌ 备份跑出了 backup/（路径穿越）"; exit 1
          fi
          test -d "$BK/evil" \
            || { echo "❌ 备份目录名不对，实际: $(ls -A "$BK" 2>/dev/null | tr '\n' ' ')"; exit 1; }
          if ls -A "$BK" | grep -q '^\.'; then
            echo "❌ 备份目录是隐藏的（用户看不见自己的备份）"; exit 1
          fi

          echo "✅ 覆盖前都会备份，且备份目录可发现、路径不可穿越"
      - name: 备份不会无限堆积（保留最近 N 份, 且只动自己的东西）
        shell: bash
        run: |
          set -euo pipefail
          LYCO="$PWD/demo/lyco-cli/lyco/target/release/lyco"
          OUT="$(mktemp -d)"
          export HOME="$OUT/home"
          T="$HOME/.lyco/templates"
          W="$HOME/.lyco/web"
          BK="$HOME/.lyco/backup"
          mkdir -p "$T" "$W"
          cd "$OUT"

          # ① 真实产生一份备份（老用户现场），并检查自述文件
          printf '1.2.0' > "$T/.version"
          printf '/* OLD-MAIN-C */\n' > "$T/main.c"
          printf '<html>OLD-PAGE</html>' > "$W/index.html"
          "$LYCO" new demo c > "$OUT/log1" 2>&1
          REAL="$(ls -A "$BK" 2>/dev/null | head -1)"
          test -n "$REAL" || { echo "❌ 没有产生备份"; exit 1; }
          test -f "$BK/$REAL/.meta" || { echo "❌ 备份里没有 .meta（用户看不懂这是哪一版留下的）"; exit 1; }
          grep -q '^created=' "$BK/$REAL/.meta" || { echo "❌ .meta 缺 created="; exit 1; }
          grep -q '^replaced_by=1.2.0-' "$BK/$REAL/.meta" || { echo "❌ .meta 缺 replaced_by（应写新版戳）"; exit 1; }

          # ② 塞 12 份"更早的"备份（created 递增，便于断言删的是**最旧的**），
          #    外加两份"不是我们的东西"：用户自己的目录 + 一个散落文件。
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            d="$BK/1.0.$i-aaaaaaaaaaaaaa$i"
            mkdir -p "$d"
            printf 'created=1000000%s\nreplaced_by=x\n' "$i" > "$d/.meta"
          done
          mkdir -p "$BK/my-own-notes"
          printf 'do not touch\n' > "$BK/my-own-notes/keep.txt"
          printf 'stray\n' > "$BK/readme.txt"

          # 触发一次释放（把戳改回旧值即可）→ 顺带触发清理
          printf '1.2.0' > "$T/.version"
          "$LYCO" new demo2 c > "$OUT/log2" 2>&1
          cat "$OUT/log2"

          # ③ 默认保留 10 份：12 假 + 1 真 = 13 → 删最旧的 3 份（created 01/02/03）。
          #    最要紧的是**别把最新的删掉** —— 排序反了就会删掉刚备份出来的那份。
          test -d "$BK/$REAL" || { echo "❌ 最新的那份备份被删了（排序反了？）"; exit 1; }
          test -d "$BK/1.0.12-aaaaaaaaaaaaaa12" || { echo "❌ 第二新的备份被删了"; exit 1; }
          test -d "$BK/1.0.04-aaaaaaaaaaaaaa04" || { echo "❌ 保留了太旧的备份（应该只留 10 份）"; exit 1; }
          for i in 01 02 03; do
            if [ -e "$BK/1.0.$i-aaaaaaaaaaaaaa$i" ]; then
              echo "❌ 最旧的 1.0.$i 没被清理（保留数没生效？）"; exit 1
            fi
          done
          grep -q '已清理 3 份' "$OUT/log2" || { echo "❌ 清理了却没告诉用户"; exit 1; }
          grep -q 'LYCO_BACKUP_KEEP=0' "$OUT/log2" || { echo "❌ 没说怎么关掉自动清理"; exit 1; }

          # ④ 只动自己的东西：用户在 backup/ 里放的东西必须原封不动。
          #    只靠名字区分不了（my-own-notes 也是合法的 sanitize 结果），
          #    真正的判据是「有没有我们写的 .meta」。
          test -f "$BK/my-own-notes/keep.txt" || { echo "❌ 删了用户在 backup/ 里自己放的东西"; exit 1; }
          test -f "$BK/readme.txt" || { echo "❌ 删了 backup/ 里的散落文件"; exit 1; }

          # ⑤ LYCO_BACKUP_KEEP=0 → 全部保留（逃生通道）
          before_n="$(ls -A "$BK" | wc -l | tr -d ' ')"
          printf '1.2.0' > "$T/.version"
          LYCO_BACKUP_KEEP=0 "$LYCO" new demo3 c > "$OUT/log3" 2>&1
          after_n="$(ls -A "$BK" | wc -l | tr -d ' ')"
          test "$after_n" -eq "$before_n" \
            || { echo "❌ LYCO_BACKUP_KEEP=0 时仍被清理: $before_n -> $after_n"; exit 1; }
          if grep -q '已清理' "$OUT/log3"; then echo "❌ 关掉了清理却仍报告清理"; exit 1; fi

          # ⑥ reset 不该剪掉安全网：备份可能是用户唯一的恢复副本
          "$LYCO" reset > "$OUT/log4" 2>&1
          test -d "$BK" || { echo "❌ lyco reset 把模板备份一起删了（那是唯一的恢复副本）"; exit 1; }
          test -f "$BK/$REAL/.meta" || { echo "❌ reset 后备份内容不完整"; exit 1; }
          grep -q '模板备份已保留' "$OUT/log4" || { echo "❌ reset 没说备份被保留了"; exit 1; }
          if [ -f "$T/main.c" ]; then echo "❌ reset 没有清掉模板"; exit 1; fi

          echo "✅ 备份有保留上限、可关闭、只动自己的东西，且 reset 不剪安全网"
