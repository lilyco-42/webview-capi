name: Cross-Platform CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev
      - name: Build
        run: cargo build --release
        working-directory: lyco-webview/lyco
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lyco-linux
          path: lyco-webview/lyco/target/release/lyco

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
        working-directory: lyco-webview/lyco
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lyco-macos
          path: lyco-webview/lyco/target/release/lyco

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: cd demo/android && bash build_apk.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: demo/android/out/*.apk
