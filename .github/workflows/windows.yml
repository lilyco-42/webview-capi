name: Windows CI

# 原 workflow 是整体从另一个项目（Rust 桌面应用 Lyco WebView Studio）搬过来的，
# 从来没跑通过。逐条实证：
#   * working-directory: lyco-webview/lyco  —— 目录不存在，真实路径 demo/lyco-cli/lyco
#     报错：An error occurred trying to start process 'pwsh.EXE' with working directory
#           'D:\a\webview-capi\webview-capi\lyco-webview/lyco'. The directory name is invalid.
#   * wix\installer.wxs —— 该文件本身 XML 语法就是坏的
#     （`<WixVariable Id="WixUILicenseRtf" License.rtf" />` 缺 Value= 且引号错位），
#     且 Source= 引用的 LICENSE / 根目录 webview.h / webview.dll 在仓库里都不存在。
#   * msix —— msix/ 下只有 AppxManifest.xml，清单里要求的 assets\*.png 全部缺失。
# 所以这个 job 改成构建仓库真正有的东西：用 MinGW + xmake 构建 demo/c-main。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  c-demo:
    name: C demo (MinGW + xmake)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 MinGW 工具链
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      # 不要写死 C:\msys64 —— 新版 runner 镜像（windows-2025-vs2026）没有预装 MSYS2，
      # setup-msys2 会现场下载并解压到自己的临时目录（实测 D:\a\_temp\setup-msys2），
      # 于是 C:\msys64\mingw64\bin\gcc.exe 不存在。用 action 的 msys2-location 输出。
      - name: 把 MinGW 加进 PATH
        shell: pwsh
        run: |
          $root  = '${{ steps.msys2.outputs.msys2-location }}'
          $mingw = Join-Path $root 'mingw64'
          if (-not (Test-Path "$mingw\bin\gcc.exe")) {
            "msys2-location = $root"
            "--- $root ---"
            Get-ChildItem $root -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            "--- $root\mingw64 ---"
            Get-ChildItem "$mingw" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            throw "找不到 $mingw\bin\gcc.exe"
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MINGW_DIR=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # 注意：PowerShell 里 "--version" 的 "--" 会被当参数终结符，
          # 必须用调用运算符 & 才能把 --version 传给原生程序。
          & "$mingw\bin\gcc.exe" --version

      - name: 装 xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          # 不要开 package-cache：它会执行 `xmake l utils.ci.packageskey` 算缓存键，
          # 而该脚本需要配合 project-path 才能算出键，否则以退出码 4294967295(-1) 失败。
          # 这只是可选优化，去掉最省事。

      - name: 构建 demo/c-main
        shell: pwsh
        working-directory: demo/c-main
        run: |
          # --mingw= 要的是 MinGW 的**前缀目录**（其下是 bin/），不是 bin/ 本身；
          # 引号包住，避免 PowerShell 对 "--" 开头的 token 做特殊处理。
          xmake f -y "--mingw=$env:MINGW_DIR"
          xmake -y

      - name: 校验产物（存在 + PE 子系统是 GUI）
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter c-main.exe demo/c-main/build |
                 Select-Object -First 1
          if (-not $exe) { throw "没找到 c-main.exe" }
          $b   = [IO.File]::ReadAllBytes($exe.FullName)
          $pe  = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          "产物: $($exe.FullName)"
          "大小: $($b.Length) B"
          "子系统: $sub (2=GUI, 3=console)"
          if ($sub -ne 2) { throw "子系统应为 2(GUI)，实际 $sub —— 检查 xmake.lua 里的 -mwindows" }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: c-main-mingw
          path: demo/c-main/build/**/c-main.exe
          if-no-files-found: error

  lyco-cli-windows:
    name: lyco CLI (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo/lyco-cli/lyco
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          cargo run --release --locked -- list
          cargo run --release --locked -- info

      # 死代码防线：`lyco` 这个 crate 必须保持 0 告警。
      #
      # 为什么值得单独一条：它长期挂着 9 个 never-used 告警
      # （4 个死函数 + 1 个死字段 + 冗余变量 + 无用的 mut + 2 个死模块函数），
      # 而这类告警背后藏着真 bug —— 比如 `list_projects` 从没被调用，
      # 意味着 `lyco new` 一直在往一张没人读的表里写数据；`init()` 里的
      # `.expect()` 还让「新建项目」因为一个用不到的数据库打不开而 panic。
      # 告警是唯一的信号，一旦被淹没就没人看了。
      #
      # 两个刻意的取舍：
      #   * 只断言**具体这几类**告警，不用 `-Dwarnings` —— CI 用的是浮动的
      #     `dtolnay/rust-toolchain@stable`，`-Dwarnings` 会因为 rustc 将来
      #     新增的任意 lint 把 CI 弄红，而这几类是稳定的老 lint。
      #   * 必须先 `cargo clean -p lyco --release`：否则构建命中缓存、
      #     根本不重编，断言就成了永远为真的废话。
      - name: lyco 保持 0 告警（死代码防线）
        shell: pwsh
        run: |
          # 这一步要**故意捕获** cargo 打到 stderr 的告警，所以先关掉
          # 会把 stderr 升级成终止错误的开关（见下面「依赖写法」那一步的说明）。
          $ErrorActionPreference = 'Continue'

          cargo clean -p lyco --release
          $log = (cargo build --release --locked 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "构建失败:`n$log" }

          $pats = @('is never used', 'is never read',
                    'unused variable', 'unused import', 'does not need to be mutable')
          $hit = @()
          foreach ($p in $pats) {
            if ($log -match [regex]::Escape($p)) { $hit += $p }
          }
          if ($hit.Count -gt 0) {
            throw ("出现死代码/未使用告警: " + ($hit -join ', ') + "`n$log")
          }
          '无死代码告警 ✓'

      # 依赖写法（`{ path }` / `{ git }` / 校验分支）的回归防线。
      #
      # 只断言**生成物**：`lyco build` 是「先写 xmake.lua、再调 xmake」，所以
      # 这一步不依赖 xmake / 编译器是否装好 —— 不会因为 runner 的工具链差异变红，
      # 也不需要往这个 job 里塞第二个 setup action。
      # 断言点选的是 add_repositories 那一行：它是 `{ path }` / `{ git }` 在
      # xmake 侧**唯一**的落地方式，与功能 1:1 对应（比「命令没报错」强得多）。
      - name: 依赖写法端到端（含错误分支）
        shell: pwsh
        run: |
          # 这一步**故意**要跑会失败的命令（错误分支），所以显式关掉两个会把
          # 「非零退出 / stderr」升级成终止错误的开关：Actions 的 pwsh 会先设
          # $ErrorActionPreference='stop'，新版 pwsh 还多了
          # $PSNativeCommandUseErrorActionPreference（本机 7.6 上是 False，
          # 但那是版本默认值，不能赌）。关掉它们不会掩盖问题 —— 断言本身用
          # throw，throw 永远是终止错误。
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $lyco = (Resolve-Path 'target/release/lyco.exe').Path
          $d    = Join-Path $env:RUNNER_TEMP 'lyco-dep-check'
          Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$d/src" -Force | Out-Null
          Set-Content -Encoding utf8 "$d/Lyco.toml" "[package]`nname = `"depcheck`"`nversion = `"0.1.0`"`n`n[dependencies]`n"
          Set-Content -Encoding utf8 "$d/src/main.c" "int main(void) { return 0; }"

          # 造一个最小本地 xmake 包仓库。配方故意什么都不做：只为证明
          # path 能一路解析到 packages/<包名>/xmake.lua，不涉及网络与编译。
          # 注意 `package("…")` 后面那一段就是它的函数体，**没有**收尾的 `end)`
          # —— 多写一行 xmake 会报 `<eof> expected near 'end'`。
          $repo = Join-Path $d 'localrepo'
          New-Item -ItemType Directory -Path "$repo/packages/z/zzmini" -Force | Out-Null
          Set-Content -Encoding utf8 "$repo/packages/z/zzmini/xmake.lua" (@(
            'package("zzmini")'
            '    set_homepage("https://example.com")'
            '    on_install(function (package) end)'
          ) -join "`n")

          function Assert-Fails([string]$desc, [scriptblock]$sb) {
            # 不用 2>&1 抓输出：那会把 stderr 变成 ErrorRecord，正好撞上上面
            # 要避开的坑。让它直接打到日志里，我们只要退出码。
            & $sb
            if ($LASTEXITCODE -eq 0) { throw "$desc 本该失败, 实际退出码 0" }
            "  ok  $desc -> 退出码 $LASTEXITCODE"
          }

          Push-Location $d
          try {
            '== 错误分支：必须失败, 且不能留下半个清单 =='
            $before = Get-Content Lyco.toml -Raw
            Assert-Fails 'path 不存在'        { & $lyco add zz --path ./nope }
            if ((Get-Content Lyco.toml -Raw) -ne $before) { throw '校验失败时不该改动 Lyco.toml' }
            '  ok  校验失败时 Lyco.toml 未被改动'
            Assert-Fails 'git 与 path 同时给' { & $lyco add zz --git https://example.com/r.git --path ./localrepo }
            Assert-Fails '未知参数'           { & $lyco add zz --bogus }

            '== 正常分支：写进 Lyco.toml =='
            & $lyco add zzmini --path ./localrepo
            if ($LASTEXITCODE -ne 0) { throw 'lyco add --path 失败' }
            $toml = Get-Content Lyco.toml -Raw
            if ($toml -notmatch 'zzmini\s*=\s*\{\s*path\s*=\s*"\./localrepo"\s*\}') {
              throw "Lyco.toml 没写对:`n$toml"
            }
            '  ok  Lyco.toml 得到 { path = "./localrepo" }'

            '== 生成物：xmake 侧拿到的是绝对路径、且不含 .. =='
            # 这句会失败（本 job 没装 xmake），但 xmake.lua 在调 xmake **之前**
            # 就已写出，所以不影响断言。断言不过的话上面早 throw 了。
            & $lyco build
            if (-not (Test-Path xmake.lua)) { throw 'lyco build 没生成 xmake.lua' }
            $m = [regex]::Match((Get-Content xmake.lua -Raw), 'add_repositories\("zzmini ([^"]+)"\)')
            if (-not $m.Success) { throw "xmake.lua 里没有 add_repositories(`"zzmini <dir>`")" }
            $dir = $m.Groups[1].Value
            "  ok  add_repositories -> $dir"
            if ($dir -match '\.\.')           { throw "本地仓目录不该含 .. : $dir" }
            if ($dir -notmatch '^[A-Za-z]:/') { throw "本地仓目录应是绝对路径: $dir" }
            if (-not (Test-Path (Join-Path $dir 'packages/z/zzmini/xmake.lua'))) {
              throw "解析出的目录没指到真实包仓库: $dir"
            }
            '  ok  绝对路径 / 不含 .. / 指向真实包仓库'
          } finally { Pop-Location }

          # 这一行不能省：Actions 的 pwsh shell 最后会 `exit $LASTEXITCODE`，
          # 而上面那句 `lyco build` 是**故意容许失败**的。断言失败的话早就
          # throw 退出了，走不到这里。
          exit 0

      - name: 上传 lyco.exe
        uses: actions/upload-artifact@v4
        with:
          name: lyco-windows
          path: demo/lyco-cli/lyco/target/release/lyco.exe
          if-no-files-found: error

  # 这个 demo 在根 README 里挂着链接，但仓里没人引用它、也没有任何 CI 构建它，
  # 于是坏了 18 天没人发现（连编译都过不了）。本 job 就是那条缺失的防线。
  #
  # 只能跑 Windows：lib/ 里只有 Windows 产物（webview.dll + webview.lib），
  # macOS / Linux 得自己编那个 C 库。
  rust-ffi:
    name: Rust FFI demo (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 这一步同时守住两个回归：
      #   * src/lib.rs 的重复定义（E0252）—— 编译期就炸
      #   * build.rs 的链接配置 —— 找不到导入库时报 LNK1181
      #     （MSVC 对缺失的 .lib 是硬错误，即使符号没被引用）
      - name: 构建 demo/rust-ffi
        working-directory: demo/rust-ffi
        run: cargo build

      - name: 校验产物（rlib 必须存在）
        shell: pwsh
        working-directory: demo/rust-ffi
        run: |
          # rlib 存在 <=> crate-type 里含 "lib"。
          # 少了它这个 crate 谁也用不了 —— 消费方会报
          #   error[E0433]: cannot find module or crate `webview_capi` in this scope
          foreach ($f in 'libwebview_capi.rlib', 'webview_capi.dll') {
            $p = Join-Path 'target/debug' $f
            if (-not (Test-Path $p)) { throw "缺产物 $p" }
            "$p  $((Get-Item $p).Length) B"
          }

      # 上面那个 rlib 断言只是「代理指标」；这条才是真正的用户视角回归测试：
      # 拿一个独立 crate 真的 use 一次。crate-type / 链接配置 / 公开 API
      # 任何一处坏了，这里都会编译失败。
      - name: 独立消费方真的 use 它
        shell: pwsh
        run: |
          $ws  = ($env:GITHUB_WORKSPACE -replace '\\','/')
          $dir = Join-Path $env:RUNNER_TEMP 'rust-ffi-consumer'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          cargo new $dir --bin --quiet
          Push-Location $dir
          cargo add webview-capi --path "$ws/demo/rust-ffi" --quiet
          Set-Content -Encoding utf8 'src/main.rs' 'fn main() { let w = webview_capi::WebView::new(false); println!("{}", w.is_some()); }'
          cargo build
          Pop-Location
          '消费方编译通过 —— 这个 crate 真的能被 use'
