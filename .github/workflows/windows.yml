name: Windows CI

# 原 workflow 是整体从另一个项目（Rust 桌面应用 Lyco WebView Studio）搬过来的，
# 从来没跑通过。逐条实证：
#   * working-directory: lyco-webview/lyco  —— 目录不存在，真实路径 demo/lyco-cli/lyco
#     报错：An error occurred trying to start process 'pwsh.EXE' with working directory
#           'D:\a\webview-capi\webview-capi\lyco-webview/lyco'. The directory name is invalid.
#   * wix\installer.wxs —— 该文件本身 XML 语法就是坏的
#     （`<WixVariable Id="WixUILicenseRtf" License.rtf" />` 缺 Value= 且引号错位），
#     且 Source= 引用的 LICENSE / 根目录 webview.h / webview.dll 在仓库里都不存在。
#   * msix —— msix/ 下只有 AppxManifest.xml，清单里要求的 assets\*.png 全部缺失。
# 所以这个 job 改成构建仓库真正有的东西：用 MinGW + xmake 构建 demo/c-main。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  c-demo:
    name: C demo (MinGW + xmake)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 MinGW 工具链
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      # 不要写死 C:\msys64 —— 新版 runner 镜像（windows-2025-vs2026）没有预装 MSYS2，
      # setup-msys2 会现场下载并解压到自己的临时目录（实测 D:\a\_temp\setup-msys2），
      # 于是 C:\msys64\mingw64\bin\gcc.exe 不存在。用 action 的 msys2-location 输出。
      - name: 把 MinGW 加进 PATH
        shell: pwsh
        run: |
          $root  = '${{ steps.msys2.outputs.msys2-location }}'
          $mingw = Join-Path $root 'mingw64'
          if (-not (Test-Path "$mingw\bin\gcc.exe")) {
            "msys2-location = $root"
            "--- $root ---"
            Get-ChildItem $root -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            "--- $root\mingw64 ---"
            Get-ChildItem "$mingw" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            throw "找不到 $mingw\bin\gcc.exe"
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MINGW_DIR=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # 注意：PowerShell 里 "--version" 的 "--" 会被当参数终结符，
          # 必须用调用运算符 & 才能把 --version 传给原生程序。
          & "$mingw\bin\gcc.exe" --version

      - name: 装 xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          # 不要开 package-cache：它会执行 `xmake l utils.ci.packageskey` 算缓存键，
          # 而该脚本需要配合 project-path 才能算出键，否则以退出码 4294967295(-1) 失败。
          # 这只是可选优化，去掉最省事。

      - name: 构建 demo/c-main
        shell: pwsh
        working-directory: demo/c-main
        run: |
          # --mingw= 要的是 MinGW 的**前缀目录**（其下是 bin/），不是 bin/ 本身；
          # 引号包住，避免 PowerShell 对 "--" 开头的 token 做特殊处理。
          xmake f -y "--mingw=$env:MINGW_DIR"
          xmake -y

      - name: 校验产物（存在 + PE 子系统是 GUI）
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter c-main.exe demo/c-main/build |
                 Select-Object -First 1
          if (-not $exe) { throw "没找到 c-main.exe" }
          $b   = [IO.File]::ReadAllBytes($exe.FullName)
          $pe  = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          "产物: $($exe.FullName)"
          "大小: $($b.Length) B"
          "子系统: $sub (2=GUI, 3=console)"
          if ($sub -ne 2) { throw "子系统应为 2(GUI)，实际 $sub —— 检查 xmake.lua 里的 -mwindows" }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: c-main-mingw
          path: demo/c-main/build/**/c-main.exe
          if-no-files-found: error

  lyco-cli-windows:
    name: lyco CLI (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo/lyco-cli/lyco
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          cargo run --release --locked -- list
          cargo run --release --locked -- info

      - name: 上传 lyco.exe
        uses: actions/upload-artifact@v4
        with:
          name: lyco-windows
          path: demo/lyco-cli/lyco/target/release/lyco.exe
          if-no-files-found: error

  # 这个 demo 在根 README 里挂着链接，但仓里没人引用它、也没有任何 CI 构建它，
  # 于是坏了 18 天没人发现（连编译都过不了）。本 job 就是那条缺失的防线。
  #
  # 只能跑 Windows：lib/ 里只有 Windows 产物（webview.dll + webview.lib），
  # macOS / Linux 得自己编那个 C 库。
  rust-ffi:
    name: Rust FFI demo (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 这一步同时守住两个回归：
      #   * src/lib.rs 的重复定义（E0252）—— 编译期就炸
      #   * build.rs 的链接配置 —— 找不到导入库时报 LNK1181
      #     （MSVC 对缺失的 .lib 是硬错误，即使符号没被引用）
      - name: 构建 demo/rust-ffi
        working-directory: demo/rust-ffi
        run: cargo build

      - name: 校验产物（rlib 必须存在）
        shell: pwsh
        working-directory: demo/rust-ffi
        run: |
          # rlib 存在 <=> crate-type 里含 "lib"。
          # 少了它这个 crate 谁也用不了 —— 消费方会报
          #   error[E0433]: cannot find module or crate `webview_capi` in this scope
          foreach ($f in 'libwebview_capi.rlib', 'webview_capi.dll') {
            $p = Join-Path 'target/debug' $f
            if (-not (Test-Path $p)) { throw "缺产物 $p" }
            "$p  $((Get-Item $p).Length) B"
          }

      # 上面那个 rlib 断言只是「代理指标」；这条才是真正的用户视角回归测试：
      # 拿一个独立 crate 真的 use 一次。crate-type / 链接配置 / 公开 API
      # 任何一处坏了，这里都会编译失败。
      - name: 独立消费方真的 use 它
        shell: pwsh
        run: |
          $ws  = ($env:GITHUB_WORKSPACE -replace '\\','/')
          $dir = Join-Path $env:RUNNER_TEMP 'rust-ffi-consumer'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          cargo new $dir --bin --quiet
          Push-Location $dir
          cargo add webview-capi --path "$ws/demo/rust-ffi" --quiet
          Set-Content -Encoding utf8 'src/main.rs' 'fn main() { let w = webview_capi::WebView::new(false); println!("{}", w.is_some()); }'
          cargo build
          Pop-Location
          '消费方编译通过 —— 这个 crate 真的能被 use'
