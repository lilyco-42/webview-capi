name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build lyco CLI
        run: cargo build --release
        working-directory: lyco-webview/lyco

      - name: Run tests
        run: cargo test --release
        working-directory: lyco-webview/lyco

      - name: Build MSI (WiX)
        run: |
          candle.exe wix\installer.wxs -o wix\installer.wixobj
          light.exe wix\installer.wixobj -o wix\lyco.msi -ext WixUIExtension
        shell: cmd

      - name: Build MSIX
        run: |
          makeappx pack /d msix /p wix\lyco.msix
          signtool sign /fd SHA256 /a wix\lyco.msix
        shell: cmd
        continue-on-error: true

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: lyco-msi
          path: wix/*.msi

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: lyco-msix
          path: wix/*.msix

      - name: Upload lyco.exe
        uses: actions/upload-artifact@v4
        with:
          name: lyco-windows
          path: lyco-webview/lyco/target/release/lyco.exe
