[package]
name = "lyco"
version = "1.0.0"
edition = "2024"
description = "一键生成跨平台 WebView 项目 (WASM 插件架构 + SQLite + Tera)"
license = "MIT"
repository = "https://github.com/lilyco-42/webview-capi"

[dependencies]
tera = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
once_cell = "1"

[[bin]]
name = "lyco"
path = "src/main.rs"
