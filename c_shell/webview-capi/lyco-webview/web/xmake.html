<!DOCTYPE html>
<html lang="zh" x-data="xmakeManager()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xmake 包管理器</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--bg3:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--purple:#a855f7;--cyan:#06b6d4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1100px;margin:0 auto;padding:40px 20px}
h1{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-box{display:flex;gap:8px;margin:20px 0}
.input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:10px;font-size:0.95rem}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:1px solid var(--border);border-radius:10px;background:var(--bg3);color:var(--text);font-size:0.85rem;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#2563eb}
.btn.success{background:var(--green);border-color:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all .2s}
.card:hover{border-color:rgba(59,130,246,0.4);transform:translateY(-2px)}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:#fff}
.card-title{font-size:1rem;font-weight:600}
.card-version{font-size:0.75rem;color:var(--muted)}
.card-desc{font-size:0.82rem;color:var(--muted);margin:8px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{background:var(--bg3);border:1px solid var(--border);color:var(--cyan);padding:3px 10px;border-radius:12px;font-size:0.72rem}
.card-actions{display:flex;gap:8px;margin-top:12px}
.btn.sm{padding:6px 14px;font-size:0.78rem}
.btn.install{background:var(--green);border-color:var(--green);color:#fff}
.installed-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(34,197,94,0.1);border:1px solid var(--green);color:var(--green);padding:4px 12px;border-radius:8px;font-size:0.75rem}
.tabs{display:flex;gap:6px;margin:20px 0}
.tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:0.85rem;color:var(--muted);transition:all .2s}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{background:var(--bg3);color:var(--blue)}
.console{background:#000;border-radius:10px;padding:14px;font-family:Consolas,monospace;font-size:0.78rem;color:var(--green);height:200px;overflow-y:auto;white-space:pre-wrap;margin-top:16px}
.console .err{color:var(--red)}.console .info{color:var(--cyan)}
</style>
</head>
<body>
<div class="container">
<h1>📦 xmake 包管理器</h1>
<p style="color:var(--muted)">管理 xmake 依赖,一键安装、更新、搜索包</p>

<div class="search-box">
<input class="input" placeholder="搜索包名 (如: webview, wasm, python...)" x-model="search" @input="filterPkgs()">
<button class="btn primary" @click="searchPkgs()">🔍 搜索</button>
<button class="btn" @click="updateIndex()">🔄 更新索引</button>
</div>

<div class="tabs">
<div class="tab" :class="{active: view==='browse'}" @click="view='browse'">浏览</div>
<div class="tab" :class="{active: view==='installed'}" @click="view='installed'">已安装</div>
<div class="tab" :class="{active: view==='console'}" @click="view='console'">终端</div>
</div>

<div class="grid" x-show="view==='browse'">
<template x-for="pkg in filteredPkgs" :key="pkg.name">
<div class="card">
<div class="card-header">
<div class="icon" x-text="pkg.icon || pkg.name[0].toUpperCase()"></div>
<div><div class="card-title" x-text="pkg.name"></div><div class="card-version" x-text="pkg.version"></div></div>
</div>
<div class="card-desc" x-text="pkg.desc"></div>
<div class="tags"><template x-for="t in pkg.tags"><span class="tag" x-text="t"></span></template></div>
<div class="card-actions">
<template x-if="!pkg.installed">
<button class="btn install sm" @click="installPkg(pkg)">⬇ 安装</button>
</template>
<template x-if="pkg.installed">
<span class="installed-badge">✓ 已安装</span>
</template>
<button class="btn sm" @click="showPkgInfo(pkg)">详情</button>
<button class="btn sm" @click="removePkg(pkg)" x-show="pkg.installed">移除</button>
</div>
</div>
</template>
</div>

<div class="grid" x-show="view==='installed'">
<template x-for="pkg in installedPkgs" :key="pkg.name">
<div class="card">
<div class="card-header">
<div class="icon" x-text="pkg.name[0].toUpperCase()"></div>
<div><div class="card-title" x-text="pkg.name"></div><div class="card-version" x-text="pkg.version"></div></div>
</div>
<button class="btn sm" @click="removePkg(pkg)">移除</button>
<button class="btn sm" @click="updatePkg(pkg)">⬆ 更新</button>
</div>
</template>
</div>

<div x-show="view==='console'">
<div class="console" x-ref="console" x-html="consoleLog"></div>
<div style="display:flex;gap:8px;margin-top:8px">
<input class="input" placeholder="xmake 命令..." x-model="cmdInput" @keydown.enter="runCmd()">
<button class="btn primary" @click="runCmd()">执行</button>
</div>
</div>
</div>

<script>
function xmakeManager() {
return {
view: 'browse',
search: '',
consoleLog: '',
cmdInput: '',
pkgs: [
{name:'webview-capi',version:'1.0.0',desc:'C API for WebView2',tags:['c','webview','ffi'],installed:false,icon:'W'},
{name:'webview-mini',version:'0.1.0',desc:'Minimal WebView2 wrapper',tags:['c','webview'],installed:true,icon:'M'},
{name:'wasm-runtime',version:'2.0.0',desc:'WebAssembly runtime',tags:['wasm','web'],installed:false,icon:'W'},
{name:'python-wasm',version:'3.11.0',desc:'Python WASM build',tags:['python','wasm'],installed:false,icon:'P'},
{name:'lua',version:'5.4.0',desc:'Lua scripting',tags:['script','embed'],installed:true,icon:'L'},
{name:'sqlite',version:'3.40.0',desc:'SQLite database',tags:['db','storage'],installed:false,icon:'S'},
{name:'zlib',version:'1.2.13',desc:'Compression library',tags:['compress'],installed:false,icon:'Z'},
{name:'openssl',version:'3.0.0',desc:'SSL/TLS library',tags:['crypto','ssl'],installed:false,icon:'O'},
],
filteredPkgs: [],
get installedPkgs() { return this.pkgs.filter(p => p.installed); },

init() { this.filteredPkgs = this.pkgs; },

filterPkgs() {
const q = this.search.toLowerCase();
this.filteredPkgs = q ? this.pkgs.filter(p => p.name.includes(q) || p.desc.includes(q) || p.tags.some(t => t.includes(q))) : this.pkgs;
},

searchPkgs() {
this.consoleLog += `\n$ xmake search ${this.search}`;
setTimeout(() => { this.consoleLog += `\n搜索完成,找到 ${this.filteredPkgs.length} 个包`; }, 500);
},

installPkg(pkg) {
this.consoleLog += `\n$ xmake require --install ${pkg.name}`;
setTimeout(() => { pkg.installed = true; this.consoleLog += `\n✓ ${pkg.name} 安装成功`; }, 800);
},

removePkg(pkg) {
pkg.installed = false;
this.consoleLog += `\n$ xmake remove ${pkg.name}`;
setTimeout(() => this.consoleLog += `\n✓ ${pkg.name} 已移除`, 300);
},

updatePkg(pkg) {
this.consoleLog += `\n$ xmake update ${pkg.name}`;
setTimeout(() => this.consoleLog += `\n✓ ${pkg.name} 已更新`, 500);
},

updateIndex() {
this.consoleLog += '\n$ xmake repo --update';
setTimeout(() => this.consoleLog += '\n✓ 包索引已更新', 600);
},

runCmd() {
if (!this.cmdInput.trim()) return;
this.consoleLog += `\n$ ${this.cmdInput}`;
const cmd = this.cmdInput.toLowerCase();
if (cmd === 'help') this.consoleLog += '\n命令: search, install, remove, update, list, help';
else if (cmd === 'list') this.consoleLog += '\n' + this.installedPkgs.map(p => `  ${p.name} ${p.version}`).join('\n');
else this.consoleLog += '\n(模拟执行)';
this.cmdInput = '';
}
}
}
</script>
</body>
</html>
