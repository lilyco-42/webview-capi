[package]
name = "lyco"
version = "1.2.0"
edition = "2024"
description = "cargo 风格的跨平台 WebView 项目管理器 (Lyco.toml + xmake + WASM 插件架构)"
license = "MIT"
repository = "https://github.com/lilyco-42/webview-capi"

[dependencies]
tera = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
once_cell = "1"
toml = "0.8"
toml_edit = "0.22"

[[bin]]
name = "lyco"
path = "src/main.rs"
