[package]
name = "webview-capi"
version = "0.1.0"
edition = "2021"
# 原来这里是仓库本身的描述（"C API for WebView2 - callable from any language"），
# 但这个 crate 是 **Rust 绑定**、C 侧调不了（见 [lib] 下面的注释），描述与事实不符。
description = "Rust 绑定：webview C API（lib/webview.dll）的安全封装"
license = "MIT"
repository = "https://github.com/lilyco-42/webview-capi"
keywords = ["webview", "webview2", "ffi", "bindings"]
categories = ["ffi", "gui"]

[lib]
name = "webview_capi"
path = "src/lib.rs"
# 必须带 "lib"(rlib)：本 crate 的公开 API 是 Rust 类型
# （`pub struct WebView` + 收 `&str` 的方法），C 侧调不了，
# 所以它是要被 Rust 代码 `use` 的绑定库。
# 原来只有 cdylib/staticlib → 谁也用不了，rustc 直接报：
#   error[E0433]: cannot find module or crate `webview_capi` in this scope
#   = help: consider adding 'dylib' or 'rlib' to key 'crate-type' …
# 这里只做「加」，不删原有产物，保持向后兼容。
crate-type = ["lib", "cdylib", "staticlib"]

# 无第三方依赖：类型取自 std（std::os::raw / std::ffi），
# 链接目标由 build.rs 指定（仓库根的 lib/webview.lib）。
# 原来这里挂着 `libc = "0.2"` 与 `[build-dependencies] cc = "1.0"`，
# 但 src/lib.rs 与 build.rs 都没有引用过它们 —— 是复制粘贴残留，已删。
