<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyco WebView Studio</title>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--bg3:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--purple:#a855f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(17,24,39,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);font-size:0.82rem;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.nav{flex:1;overflow-y:auto;padding:8px}
.nav-section{padding:12px 12px 4px;font-size:0.68rem;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:0.82rem;transition:all .15s}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,0.15);color:var(--blue)}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.panel{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:1rem;margin-bottom:12px;color:var(--blue)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:4px}
.input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:0.85rem}
.input:focus{outline:none;border-color:var(--blue)}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.lang-btn{background:var(--bg3);border:2px solid var(--border);color:var(--text);padding:12px 8px;border-radius:10px;cursor:pointer;text-align:center;transition:all .2s}
.lang-btn:hover{border-color:var(--blue);transform:translateY(-2px)}
.lang-btn.selected{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.lang-btn .icon{font-size:1.4rem}.lang-btn .name{font-size:0.75rem}
.target-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.target-btn{background:var(--bg3);border:2px solid var(--border);color:var(--text);padding:8px 4px;border-radius:8px;cursor:pointer;text-align:center;font-size:0.72rem}
.target-btn.selected{border-color:var(--green);background:rgba(34,197,94,0.1)}
.console{background:#000;border-radius:10px;padding:14px;font-family:Consolas,monospace;font-size:0.78rem;color:var(--green);height:220px;overflow-y:auto;white-space:pre-wrap;border:1px solid var(--border)}
.user-mode{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:var(--bg3);cursor:pointer;text-align:center;transition:all .2s}
.mode-btn:hover{border-color:var(--blue)}
.mode-btn.active{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.ai-panel{display:flex;flex-direction:column;height:300px}
.ai-msgs{flex:1;overflow-y:auto;padding:10px;background:var(--bg3);border-radius:10px;margin-bottom:8px}
.ai-msg{margin-bottom:8px;padding:8px 12px;border-radius:8px;font-size:0.82rem;max-width:85%}
.ai-msg.u{background:var(--blue);color:#fff;margin-left:auto}
.ai-msg.a{background:var(--bg2);border:1px solid var(--border)}
.ai-input{display:flex;gap:8px}
.ai-input input{flex:1}
.checklist{list-style:none}
.check-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.check-icon.ok{color:var(--green)}.check-icon.warn{color:var(--yellow)}.check-icon.err{color:var(--red)}
</style>
</head>
<body>
<div class="topbar">
<span class="logo">Lyco WebView Studio</span>
<span style="color:var(--muted);font-size:0.72rem">v0.5.0</span>
<div class="spacer"></div>
<button class="btn" onclick="runCheck()">🔍 自检</button>
</div>
<div class="main">
<div class="sidebar">
<div class="nav">
<div class="nav-section">快速开始</div>
<div class="nav-item active" onclick="show('new')">➕ 新建项目</div>
<div class="nav-item" onclick="show('build')">🔨 构建</div>
<div class="nav-item" onclick="show('ai')">🤖 AI 辅助</div>
<div class="nav-item" onclick="show('docs')">📖 手册</div>
<div class="nav-item" onclick="show('selfcheck')">✅ 自检</div>
<div class="nav-item" onclick="show('config')">⚙ 配置</div>
</div>
</div>
<div class="content">
<div class="panel" id="new-panel">
<div class="card"><h3>用户模式</h3>
<div class="user-mode">
<div class="mode-btn active" onclick="setMode(this,'beginner')"><div>👶</div><div style="font-size:0.75rem;margin-top:4px">小白</div></div>
<div class="mode-btn" onclick="setMode(this,'advanced')"><div>🧑‍💻</div><div style="font-size:0.75rem;margin-top:4px">高级</div></div>
</div></div>
<div class="card"><h3>编程语言</h3><div class="lang-grid" id="langs"></div></div>
<div class="card"><h3>项目信息</h3>
<div class="form-group"><label>名称</label><input class="input" id="name" placeholder="my-app"></div>
<div class="form-group"><label>URL</label><input class="input" id="url" value="https://example.com"></div>
</div>
<div class="card"><h3>目标平台</h3>
<div class="target-grid"><div class="target-btn selected">🪟 Windows</div><div class="target-btn selected">🤖 Android</div><div class="target-btn">🍎 macOS</div><div class="target-btn">🐧 Linux</div><div class="target-btn selected">🌐 WASM</div></div>
</div>
<button class="btn primary" onclick="create()" style="width:100%;padding:12px;font-size:0.9rem">🚀 创建</button>
</div>
<div class="panel" id="build-panel" style="display:none">
<div class="card"><h3>构建日志</h3><div class="console" id="log">等待构建...</div></div>
<div style="display:flex;gap:8px"><button class="btn primary" onclick="build()">🔨 构建</button><button class="btn" onclick="run()">▶ 运行</button></div>
</div>
<div class="panel" id="ai-panel" style="display:none">
<div class="card"><h3>AI 编程助手</h3>
<div class="ai-panel"><div class="ai-msgs" id="ai-box"><div class="ai-msg a">你好!配置 OpenAI Key 后启用。</div></div>
<div class="ai-input"><input class="input" id="ai-inp" placeholder="描述需求..."><button class="btn primary" onclick="askAi()">→</button></div></div></div>
</div>
<div class="panel" id="selfcheck-panel" style="display:none">
<div class="card"><h3>环境自检</h3><ul class="checklist" id="checks"></ul><button class="btn primary" style="margin-top:12px" onclick="runCheck()">重新检测</button></div>
</div>
<div class="panel" id="config-panel" style="display:none">
<div class="card"><h3>插件管理</h3>
<p style="font-size:0.82rem;color:var(--muted)">将 .so/.dll 和同名可执行文件放入 ~/.lyco/commands/ 扩展命令。</p>
</div>
</div>
</div>
</div>
<script>
const L=[{c:'c',n:'C',i:'C'},{c:'python',n:'Python',i:'🐍'},{c:'typescript',n:'TS',i:'TS'},{c:'rust',n:'Rust',i:'🦀'},{c:'go',n:'Go',i:'Go'},{c:'java',n:'Java',i:'☕'},{c:'zig',n:'Zig',i:'Z'},{c:'csharp',n:'C#',i:'#'},{c:'e',n:'易语言',i:'易'}];
let mode='beginner',lang='c';
function renderLangs(){document.getElementById('langs').innerHTML=L.map(l=>`<div class="lang-btn ${l.c===lang?'selected':''}" onclick="lang=l.c;renderLangs()"><div class="icon">${l.i}</div><div class="name">${l.n}</div></div>`).join('')}
function show(t){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(t+'-panel').style.display='block';document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.textContent.includes({new:'新建',build:'构建',ai:'AI',docs:'手册',selfcheck:'自检',config:'配置'}[t]||'')))}
function setMode(b,m){mode=m;document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function create(){const n=document.getElementById('name').value||'app';document.getElementById('log').textContent+=`\n🚀 创建 ${n} (${lang})`}
function build(){const l=document.getElementById('log');l.textContent+='\n🔨 构建中...';setTimeout(()=>l.textContent+='\n✅ 完成!',1000)}
function run(){document.getElementById('log').textContent+='\n▶ 运行中...'}
function askAi(){const i=document.getElementById('ai-inp');const b=document.getElementById('ai-box');b.innerHTML+=`<div class="ai-msg u">${i.value}</div>`;i.value='';setTimeout(()=>{b.innerHTML+=`<div class="ai-msg a">演示响应。配置 OpenAI Key 启用真实 AI。</div>`;b.scrollTop=b.scrollHeight},600)}
function runCheck(){document.getElementById('checks').innerHTML=[{s:'ok',n:'WebView2',d:'已安装'},{s:'ok',n:'Android SDK',d:'API 36'},{s:'ok',n:'Java',d:'Temurin 21'},{s:'ok',n:'Python',d:'pywebview'},{s:'warn',n:'Rust',d:'未检测'},{s:'err',n:'OpenAI Key',d:'未配置'}].map(c=>`<li class="check-item"><span class="check-icon ${c.s}">${c.s==='ok'?'✓':'!'}</span><span>${c.n}</span><span style="font-size:0.72rem;color:var(--muted)">${c.d}</span></li>`).join('')}
renderLangs();runCheck();
</script>
</body>
</html>
