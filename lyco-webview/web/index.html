<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyco WebView Manager</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-size:1rem;font-weight:600}
.topbar .spacer{flex:1}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:all .15s}
.btn:hover{background:var(--border)}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.primary:hover{background:#388bfd}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 16px;font-weight:600;font-size:0.85rem;color:var(--muted);border-bottom:1px solid var(--border)}
.project-list{flex:1;overflow-y:auto;padding:8px}
.project-item{padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:4px;transition:all .15s;display:flex;align-items:center;gap:8px}
.project-item:hover{background:var(--bg3)}
.project-item.active{background:var(--bg3);border:1px solid var(--blue)}
.project-item .icon{width:24px;height:24px;border-radius:6px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:#fff}
.project-item .info{flex:1;min-width:0}
.project-item .name{font-size:0.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-item .lang{font-size:0.7rem;color:var(--muted)}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:10px 18px;cursor:pointer;font-size:0.82rem;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.panel{flex:1;overflow-y:auto;padding:24px;display:none}
.panel.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:1rem;margin-bottom:12px;color:var(--blue)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:0.85rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;cursor:pointer;text-align:center;transition:all .15s}
.lang-btn:hover{border-color:var(--blue)}
.lang-btn.selected{border-color:var(--blue);background:rgba(88,166,255,0.1)}
.lang-btn .icon{font-size:1.3rem;margin-bottom:2px}
.lang-btn .name{font-size:0.75rem}
.target-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.target-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 4px;border-radius:6px;cursor:pointer;text-align:center;font-size:0.72rem;transition:all .15s}
.target-btn:hover{border-color:var(--green)}
.target-btn.selected{border-color:var(--green);background:rgba(63,185,80,0.1)}
.log{background:#000;border-radius:8px;padding:14px;font-family:Consolas,monospace;font-size:0.78rem;color:var(--green);height:250px;overflow-y:auto;white-space:pre-wrap}
.user-mode{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;text-align:center;transition:all .15s}
.mode-btn:hover{border-color:var(--blue)}
.mode-btn.active{border-color:var(--blue);background:rgba(88,166,255,0.1)}
.ai-chat{display:flex;flex-direction:column;height:350px}
.ai-messages{flex:1;overflow-y:auto;padding:10px;background:var(--bg3);border-radius:8px;margin-bottom:8px}
.ai-msg{margin-bottom:10px;padding:8px 12px;border-radius:8px;font-size:0.82rem}
.ai-msg.user{background:var(--blue);color:#fff;margin-left:20%}
.ai-msg.ai{background:var(--bg2);border:1px solid var(--border);margin-right:20%}
.ai-input{display:flex;gap:8px}
.ai-input input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:0.85rem}
</style>
</head>
<body>
<div class="topbar">
<h1>🚀 Lyco WebView</h1>
<div class="spacer"></div>
<select id="lang-select" onchange="setLang(this.value)" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:0.8rem">
<option value="zh">中文</option>
<option value="en">English</option>
</select>
</div>
<div class="main">
<div class="sidebar">
<div class="sidebar-header">📁 项目</div>
<div class="project-list" id="project-list"></div>
<button class="btn primary" style="margin:8px" onclick="showTab('new')">+ 新建</button>
</div>
<div class="content">
<div class="tabs">
<div class="tab active" data-tab="dashboard">📊 仪表盘</div>
<div class="tab" data-tab="new">➕ 新建项目</div>
<div class="tab" data-tab="build">🔨 构建</div>
<div class="tab" data-tab="ai">🤖 AI 辅助</div>
<div class="tab" data-tab="settings">⚙ 设置</div>
</div>
<div class="panel active" id="dashboard-panel">
<div class="card"><h3>欢迎使用 Lyco WebView</h3><p>一键生成跨平台 WebView 项目,支持 9 种编程语言。</p>
<div class="row"><div class="card"><h3>📦 项目数</h3><div style="font-size:2rem;color:var(--green)" id="proj-count">0</div></div><div class="card"><h3>🎯 平台</h3><div style="font-size:2rem;color:var(--blue)">5</div></div></div>
</div>
</div>
<div class="panel" id="new-panel">
<div class="card"><h3>用户模式</h3>
<div class="user-mode">
<div class="mode-btn active" onclick="setMode('beginner')"><div>👶</div><div style="font-size:0.78rem;margin-top:4px">小白</div></div>
<div class="mode-btn" onclick="setMode('advanced')"><div>🧑‍💻</div><div style="font-size:0.78rem;margin-top:4px">高级</div></div>
</div></div>
<div class="card"><h3>项目信息</h3>
<div class="form-group"><label>名称</label><input id="proj-name" placeholder="my-app"></div>
<div class="form-group"><label>URL</label><input id="proj-url" value="https://example.com"></div>
</div>
<div class="card"><h3>编程语言</h3><div class="lang-grid" id="lang-grid"></div></div>
<div class="card"><h3>目标平台</h3>
<div class="target-grid">
<div class="target-btn selected" data-target="windows">Windows</div>
<div class="target-btn selected" data-target="android">Android</div>
<div class="target-btn" data-target="macos">macOS</div>
<div class="target-btn" data-target="linux">Linux</div>
<div class="target-btn" data-target="wasm">WASM</div>
</div></div>
<button class="btn primary" onclick="createProject()" style="width:100%;padding:12px">🚀 创建</button>
</div>
<div class="panel" id="build-panel">
<div class="card"><h3>构建日志</h3><div class="log" id="build-log">等待构建...</div></div>
<div style="display:flex;gap:8px">
<button class="btn primary" onclick="buildProject()">🔨 构建</button>
<button class="btn" onclick="runProject()">▶ 运行</button>
</div>
</div>
<div class="panel" id="ai-panel">
<div class="card"><h3>AI 辅助编程</h3>
<div class="ai-chat">
<div class="ai-messages" id="ai-messages">
<div class="ai-msg ai">你好!我是 Lyco AI。帮你写 WebView 代码、调试构建。</div>
</div>
<div class="ai-input"><input id="ai-input" placeholder="提问..." onkeydown="if(event.key==='Enter')sendAi()"><button class="btn primary" onclick="sendAi()">→</button></div>
</div></div>
</div>
<div class="panel" id="settings-panel">
<div class="card"><h3>GitHub 认证</h3><div class="form-group"><label>Token</label><input id="gh-token" type="password" placeholder="ghp_..."></div><button class="btn" onclick="alert('请运行: gh auth login')">登录</button></div>
<div class="card"><h3>OpenAI</h3><div class="form-group"><label>API Key</label><input id="openai-key" type="password" placeholder="sk-..."></div><button class="btn primary" onclick="alert('已保存')">保存</button></div>
</div>
</div>
</div>
<script>
const LANGS=[{c:'c',n:'C',i:'C'},{c:'python',n:'Python',i:'🐍'},{c:'typescript',n:'TS',i:'TS'},{c:'rust',n:'Rust',i:'🦀'},{c:'go',n:'Go',i:'Go'},{c:'java',n:'Java',i:'☕'},{c:'zig',n:'Zig',i:'Z'},{c:'csharp',n:'C#',i:'#'},{c:'e',n:'易语言',i:'易'}];
let curLang='c',projects=[];
function renderLang(){document.getElementById('lang-grid').innerHTML=LANGS.map(l=>`<div class="lang-btn ${l.c===curLang?'selected':''}" onclick="curLang='${l.c}';renderLang()"><div class="icon">${l.i}</div><div class="name">${l.n}</div></div>`).join('')}
function renderProj(){document.getElementById('project-list').innerHTML=projects.map(p=>`<div class="project-item"><div class="icon">${p.lang[0].toUpperCase()}</div><div class="info"><div class="name">${p.name}</div><div class="lang">${p.lang}</div></div></div>`).join('');document.getElementById('proj-count').textContent=projects.length}
function createProject(){const n=document.getElementById('proj-name').value||'app';projects.push({name:n,lang:curLang});renderProj();alert('项目 '+n+' 已创建!')}
function buildProject(){const l=document.getElementById('build-log');l.textContent+='\n🔨 构建中...';setTimeout(()=>l.textContent+='\n✅ 完成!',1000)}
function runProject(){document.getElementById('build-log').textContent+='\n▶ 运行中...'}
function sendAi(){const i=document.getElementById('ai-input'),m=i.value;if(!m)return;const b=document.getElementById('ai-messages');b.innerHTML+=`<div class="ai-msg user">${m}</div>`;i.value='';setTimeout(()=>{b.innerHTML+=`<div class="ai-msg ai">这是演示响应。配置 OpenAI Key 后启用真实 AI。</div>`;b.scrollTop=b.scrollHeight},600)}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab+'-panel').classList.add('active')});
document.querySelectorAll('.target-btn').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));
renderLang();renderProj();
</script>
</body>
</html>
